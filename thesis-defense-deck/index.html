<!DOCTYPE html>
<html lang="en" id="html-root">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
  <title>Amrqhz — Thesis Defense</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/3Dmol/2.1.0/3Dmol-min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@rdkit/rdkit/dist/RDKit_minimal.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>
  <style>
    /* ===================== DESIGN TOKENS ===================== */
    :root {
      --bg: #F5F8FA;
      --bg-deep: #EDF2F5;
      --surface: #FFFFFF;
      --surface-2: #FBFCFD;
      --ink: #182533;
      --ink-soft: #51616F;
      --ink-faint: #8A99A6;
      --line: #DCE4E9;
      --line-strong: #C3CFD7;

      --blue: #2C6E8E;
      /* allosteric */
      --blue-deep: #1E4F68;
      --blue-soft: #DEEAF0;
      --red: #B24A3B;
      /* catalytic */
      --red-deep: #8C382C;
      --red-soft: #F5E3DE;
      --gold: #B5872F;
      /* mutation / highlight */
      --gold-soft: #F3E9D1;
      --green: #3C7A5E;
      /* validated / positive */
      --green-soft: #DFEEE6;
      --violet: #6C5B8C;
      /* DFT / electronic */
      --violet-soft: #E9E4F1;

      --shadow-1: 0 1px 2px rgba(24, 37, 51, .06), 0 1px 1px rgba(24, 37, 51, .04);
      --shadow-2: 0 8px 24px rgba(24, 37, 51, .10), 0 2px 6px rgba(24, 37, 51, .06);
      --shadow-3: 0 20px 48px rgba(24, 37, 51, .16);

      --radius-s: 6px;
      --radius-m: 12px;
      --radius-l: 20px;

      --serif-en: 'Newsreader', 'Vazirmatn', serif;
      --sans-en: 'Inter', 'Vazirmatn', sans-serif;
      --sans-fa: 'Vazirmatn', 'Inter', sans-serif;
      --mono: 'JetBrains Mono', monospace;

      --f-display: var(--serif-en);
      --f-body: var(--sans-en);
    }

    html[data-lang="fa"] {
      --f-display: var(--sans-fa);
      --f-body: var(--sans-fa);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      background: radial-gradient(1200px 700px at 12% -10%, #eef4f7 0%, var(--bg) 55%), var(--bg);
      color: var(--ink);
      font-family: var(--f-body);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    html[dir="rtl"] body {
      font-family: var(--sans-fa);
    }

    ::selection {
      background: var(--blue-soft);
      color: var(--blue-deep);
    }

    /* ===================== STAGE / DECK FRAME ===================== */
    #stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #deck-frame {
      position: relative;
      width: min(96vw, 177.78vh);
      height: min(54vw, 100vh);
      max-width: 1600px;
      background: var(--surface);
      border-radius: var(--radius-l);
      box-shadow: var(--shadow-3);
      overflow: hidden;
      border: 1px solid var(--line);
    }

    #slide-viewport {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .slide {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      padding: 3.6% 5.2%;
      opacity: 0;
      transform: translateY(14px) scale(.99);
      pointer-events: none;
      transition: opacity .5s cubic-bezier(.22, .61, .36, 1), transform .5s cubic-bezier(.22, .61, .36, 1);
    }

    .slide.active {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .slide-exit-left {
      transform: translateY(0) translateX(-30px) scale(.99);
    }

    .slide-exit-right {
      transform: translateY(0) translateX(30px) scale(.99);
    }

    /* subtle academic backdrop texture */
    .slide::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 20px 30px, rgba(44, 110, 142, .05) 1px, transparent 0),
        radial-gradient(1px 1px at 90px 80px, rgba(178, 74, 59, .04) 1px, transparent 0);
      background-size: 140px 140px;
      pointer-events: none;
      z-index: 0;
    }

    .slide>* {
      position: relative;
      z-index: 1;
    }

    /* ===================== TYPE SCALE ===================== */
    .eyebrow {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: .06em;
      color: var(--blue-deep);
      text-transform: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--blue-soft);
      padding: 5px 12px;
      border-radius: 999px;
      width: fit-content;
    }

    html[dir="rtl"] .eyebrow {
      font-family: var(--sans-fa);
    }

    .eyebrow .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--blue);
    }

    h1.slide-title {
      font-family: var(--f-display);
      font-weight: 600;
      font-size: clamp(26px, 2.7vw, 42px);
      line-height: 1.15;
      color: var(--ink);
      margin: 10px 0 4px 0;
      letter-spacing: -.01em;
    }

    p.slide-sub {
      font-size: clamp(13px, 1.15vw, 16px);
      color: var(--ink-soft);
      margin: 0 0 18px 0;
      max-width: 74ch;
      line-height: 1.55;
    }

    .section-tag {
      font-size: 12px;
      color: var(--ink-faint);
      font-family: var(--mono);
    }

    html[dir="rtl"] .section-tag {
      font-family: var(--sans-fa);
    }

    .body-text {
      font-size: clamp(13px, 1.05vw, 15.5px);
      line-height: 1.75;
      color: var(--ink-soft);
    }

    .body-text strong {
      color: var(--ink);
      font-weight: 600;
    }

    /* ===================== NAV / CHROME ===================== */
    #chrome {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
    }

    #progress-track {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      margin: 7px 100px 0 100px;
      height: 3px;
      background: var(--line);
    }

    #progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--blue), var(--ink));
      width: 0%;
      transition: width .4s ease;
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-2);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      pointer-events: auto;
      color: var(--ink);
      transition: .2s;
    }

    .nav-btn:hover {
      background: var(--blue);
      color: #fff;
      border-color: var(--blue);
    }

    #btn-prev {
      left: -56px;
    }

    #btn-next {
      right: -56px;
    }

    html[dir="rtl"] #btn-prev {
      left: auto;
      right: -56px;
      transform: translateY(-50%) rotate(180deg);
    }

    html[dir="rtl"] #btn-next {
      right: auto;
      left: -56px;
      transform: translateY(-50%) rotate(180deg);
    }

    #slide-counter {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--mono);
      font-size: 11px;
      color: var(--ink-faint);
      background: rgba(255, 255, 255, .7);
      backdrop-filter: blur(6px);
      padding: 5px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      pointer-events: auto;
    }

    html[dir="rtl"] #slide-counter {
      font-family: var(--sans-fa);
    }

    #lang-toggle {
      position: absolute;
      top: 16px;
      z-index: 20;
      pointer-events: auto;
      right: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px;
      box-shadow: var(--shadow-1);
      cursor: pointer;
      font-family: var(--sans-en);
      font-size: 9px;
      font-weight: 600;
    }

    html[dir="rtl"] #lang-toggle {
      right: auto;
      left: 16px;
    }

    #lang-toggle .opt {
      padding: 6px 12px;
      border-radius: 999px;
      color: var(--ink-faint);
      transition: .2s;
    }

    #lang-toggle .opt.on {
      background: var(--ink);
      color: #fff;
    }

    /* ===================== SHARED COMPONENTS ===================== */
    .grid {
      display: grid;
      gap: 16px;
    }

    .card {
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: var(--radius-m);
      padding: 16px 18px;
      box-shadow: var(--shadow-1);
    }

    .card h4 {
      margin: 0 0 6px 0;
      font-size: 14px;
      color: var(--ink);
      font-family: var(--f-body);
      font-weight: 700;
    }

    .card p {
      margin: 0;
      font-size: 12.5px;
      color: var(--ink-soft);
      line-height: 1.6;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-family: var(--mono);
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid var(--line-strong);
      color: var(--ink-soft);
    }

    html[dir="rtl"] .pill {
      font-family: var(--sans-fa);
    }

    .pill.blue {
      background: var(--blue-soft);
      color: var(--blue-deep);
      border-color: transparent;
    }

    .pill.red {
      background: var(--red-soft);
      color: var(--red-deep);
      border-color: transparent;
    }

    .pill.gold {
      background: var(--gold-soft);
      color: #7A5A1E;
      border-color: transparent;
    }

    .pill.green {
      background: var(--green-soft);
      color: #265640;
      border-color: transparent;
    }

    .pill.violet {
      background: var(--violet-soft);
      color: #4A3D68;
      border-color: transparent;
    }

    table.data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    table.data-table th {
      text-align: start;
      font-family: var(--mono);
      font-weight: 600;
      font-size: 10.5px;
      color: var(--ink-faint);
      padding: 8px 10px;
      border-bottom: 1px solid var(--line-strong);
      position: sticky;
      top: 0;
      background: var(--surface-2);
    }

    html[dir="rtl"] table.data-table th {
      font-family: var(--sans-fa);
    }

    table.data-table td {
      padding: 7px 10px;
      border-bottom: 1px solid var(--line);
      color: var(--ink-soft);
    }

    table.data-table tr:hover td {
      background: var(--blue-soft);
    }

    table.data-table td.num {
      font-family: var(--mono);
    }

    html[dir="rtl"] table.data-table td.num {
      font-family: var(--sans-fa);
    }

    table.data-table td.hi {
      color: var(--red-deep);
      font-weight: 700;
    }

    table.data-table td.hi-good {
      color: var(--green);
      font-weight: 700;
    }

    .scroll-y {
      overflow-y: auto;
    }

    .scroll-y::-webkit-scrollbar {
      width: 6px;
    }

    .scroll-y::-webkit-scrollbar-thumb {
      background: var(--line-strong);
      border-radius: 3px;
    }

    /* ===================== VERTICAL SCROLL MOTION ===================== */
    .scroll-y {
      scroll-behavior: smooth;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
      position: relative;
    }

    .scroll-y.scroll-motion {
      scroll-timeline-name: --slide-scroll;
      scroll-timeline-axis: block;
    }

    .scroll-y .scroll-reveal {
      opacity: 1;
      transform: none;
    }

    .scroll-y.has-scroll::before,
    .scroll-y.has-scroll::after {
      content: "";
      position: sticky;
      display: block;
      left: 0;
      right: 0;
      height: 18px;
      z-index: 5;
      pointer-events: none;
    }

    .scroll-y.has-scroll::before {
      top: 0;
      margin-bottom: -18px;
      background: linear-gradient(to bottom, rgba(255, 255, 255, .82), transparent);
    }

    .scroll-y.has-scroll::after {
      bottom: 0;
      margin-top: -18px;
      background: linear-gradient(to top, rgba(255, 255, 255, .82), transparent);
    }

    .vertical-scroll-hint {
      position: absolute;
      inset-inline-end: 8px;
      bottom: 8px;
      z-index: 8;
      padding: 4px 7px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, .82);
      color: var(--ink-faint);
      font: 8px var(--mono);
      letter-spacing: .08em;
      pointer-events: none;
      opacity: .85;
      transition: opacity .35s ease, transform .35s ease;
    }

    .vertical-scroll-hint.done {
      opacity: 0;
      transform: translateY(5px);
    }

    .btn {
      font-family: var(--f-body);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      padding: 9px 16px;
      border-radius: 999px;
      border: 1px solid var(--line-strong);
      background: var(--surface);
      color: var(--ink);
      transition: .2s;
      display: inline-flex;
      gap: 8px;
      align-items: center;
    }

    .btn:hover {
      border-color: var(--blue);
      color: var(--blue-deep);
    }

    .btn.primary {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }

    .btn.primary:hover {
      background: var(--blue-deep);
      border-color: var(--blue-deep);
      color: #fff;
    }

    .btn.small {
      padding: 6px 12px;
      font-size: 11.5px;
    }

    .btn svg {
      width: 14px;
      height: 14px;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .tab {
      font-size: 12px;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 999px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      color: var(--ink-soft);
      cursor: pointer;
      transition: .2s;
    }

    .tab.on {
      background: var(--blue-deep);
      color: #fff;
      border-color: var(--blue-deep);
    }

    /* Ligand cards */
    .ligand-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-m);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-shadow: var(--shadow-1);
      transition: .2s;
    }

    .ligand-card:hover {
      box-shadow: var(--shadow-2);
      transform: translateY(-2px);
      border-color: var(--blue);
    }

    .ligand-thumb {
      width: 100%;
      height: 150px;
      border-radius: var(--radius-s);
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .ligand-thumb svg {
      width: 95%;
      height: 95%;
    }

    .ligand-thumb .rdkit-mol svg {
      width: 100%;
      height: 100%;
    }

    .ligand-name {
      font-weight: 700;
      font-size: 12.5px;
    }

    .ligand-name .fa-name {
      font-family: var(--sans-fa);
      color: var(--ink-soft);
      font-weight: 500;
      font-size: 11.5px;
    }

    .ligand-meta {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      font-size: 10px;
    }

    /* Receptor select boxes */
    .receptor-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    .receptor-box {
      border: 1.5px solid var(--line);
      border-radius: var(--radius-m);
      background: var(--surface);
      padding: 16px 14px;
      cursor: pointer;
      transition: .2s;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .receptor-box:hover {
      border-color: var(--blue);
      box-shadow: var(--shadow-2);
      transform: translateY(-3px);
    }

    .receptor-box.mutant::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--gold);
    }

    .receptor-box .rcode {
      font-family: var(--mono);
      font-weight: 700;
      font-size: 16px;
      color: var(--ink);
    }

    html[dir="rtl"] .receptor-box .rcode {
      font-family: var(--sans-fa);
    }

    .receptor-box .rlabel {
      font-size: 11px;
      color: var(--ink-faint);
      margin-top: 4px;
    }

    /* 3D viewer layout */
    .viewer-wrap {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 16px;
      flex: 1;
      min-height: 0;
    }

    .viewer-3d {
      position: relative;
      background: transparent;
      border-radius: var(--radius-m);
      border: 1px solid var(--line);
      overflow: hidden;
    }

    .mol-container {
      position: absolute;
      inset: 0;
    }

    .viewer-loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
      color: var(--ink-faint);
      font-size: 12px;
      background: rgba(248, 251, 252, .85);
      z-index: 3;
    }

    .spinner {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 3px solid var(--line-strong);
      border-top-color: var(--blue);
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .viewer-controls {
      position: absolute;
      bottom: 10px;
      z-index: 4;
      display: flex;
      gap: 6px;
      left: 10px;
    }

    html[dir="rtl"] .viewer-controls {
      left: auto;
      right: 10px;
    }

    .viewer-legend {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 4;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    html[dir="rtl"] .viewer-legend {
      left: auto;
      right: 10px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      background: rgba(255, 255, 255, .85);
      padding: 4px 9px;
      border-radius: 999px;
      border: 1px solid var(--line);
    }

    .legend-swatch {
      width: 9px;
      height: 9px;
      border-radius: 3px;
    }

    /* Mutation detail panel */
    .mut-panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .aa-compare {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .aa-box {
      flex: 1;
      border-radius: var(--radius-m);
      padding: 12px;
      text-align: center;
      border: 1.5px dashed var(--line-strong);
    }

    .aa-box.from {
      background: var(--blue-soft);
      border-color: var(--blue);
    }

    .aa-box.to {
      background: var(--gold-soft);
      border-color: var(--gold);
    }

    .aa-box .aa-code {
      font-family: var(--mono);
      font-size: 22px;
      font-weight: 700;
    }

    html[dir="rtl"] .aa-box .aa-code {
      font-family: var(--sans-fa);
    }

    .aa-arrow {
      font-size: 18px;
      color: var(--ink-faint);
    }

    /* Charts / canvases */
    .chart-box {
      position: relative;
    }

    canvas {
      max-width: 100%;
    }

    /* Heatmap */
    .heatmap-scroll {
      overflow: auto;
      flex: 1;
    }

    .heatmap-table {
      border-collapse: separate;
      border-spacing: 3px;
      font-size: 10.5px;
    }

    .heatmap-table th {
      font-family: var(--mono);
      font-weight: 600;
      color: var(--ink-faint);
      padding: 4px 6px;
      font-size: 9.5px;
    }

    html[dir="rtl"] .heatmap-table th {
      font-family: var(--sans-fa);
    }

    .heatmap-cell {
      width: 56px;
      height: 26px;
      border-radius: 5px;
      text-align: center;
      font-family: var(--mono);
      font-size: 10px;
      color: #fff;
      font-weight: 600;
    }

    html[dir="rtl"] .heatmap-cell {
      font-family: var(--sans-fa);
    }

    .heatmap-rowlabel {
      font-size: 11px;
      text-align: end;
      padding-inline-end: 8px;
      white-space: nowrap;
    }

    /* Two/three column layout helpers */
    .cols-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
      flex: 1;
      min-height: 0;
    }

    .cols-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
      flex: 1;
      min-height: 0;
    }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
    }

    .grow {
      flex: 1;
      min-height: 0;
    }

    /* Big number stat */
    .stat {
      display: flex;
      flex-direction: column;
    }

    .stat .n {
      font-family: var(--f-display);
      font-size: clamp(28px, 3vw, 44px);
      font-weight: 600;
      color: var(--ink);
      line-height: 1;
    }

    .stat .l {
      font-size: 11.5px;
      color: var(--ink-faint);
      margin-top: 4px;
    }

    .stat .n.blue {
      color: var(--blue-deep);
    }

    .stat .n.red {
      color: var(--red-deep);
    }

    .stat .n.gold {
      color: #7A5A1E;
    }

    .stat .n.green {
      color: var(--green);
    }

    /* Timeline / process */
    .process-row {
      display: flex;
      align-items: stretch;
      gap: 0;
      flex: 1;
    }

    .process-step {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 16px;
      position: relative;
    }

    .process-step .pnum {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--ink-faint);
    }

    html[dir="rtl"] .process-step .pnum {
      font-family: var(--sans-fa);
    }

    .process-connector {
      width: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--line-strong);
    }

    .note-flag {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      background: var(--gold-soft);
      border: 1px solid #E3D4A6;
      border-radius: var(--radius-s);
      padding: 8px 12px;
      font-size: 11.5px;
      color: #6B4F1B;
      margin-top: 6px;
    }

    /* ===================== FIGURE / IMAGE PLACEHOLDER ===================== */
    .figure-slot {
      position: relative;
      border-radius: var(--radius-m);
      overflow: hidden;
      background: var(--bg-deep);
      box-shadow: inset 0 0 0 1px rgba(24, 37, 51, .06), var(--shadow-1);
      isolation: isolate;
    }

    /* soft ambient glow behind the photo, sampled from the same image, for depth without a heavy frame */
    .figure-slot::before {
      content: "";
      position: absolute;
      inset: -14%;
      z-index: 0;
      background-image: var(--fig-img, none);
      background-size: cover;
      background-position: center;
      filter: blur(22px) saturate(1.3) brightness(1.05);
      opacity: .55;
      transform: scale(1.08);
    }

    .figure-slot::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .35), inset 0 -30px 40px -20px rgba(24, 37, 51, .28);
    }

    .figure-slot img {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: saturate(1.08) contrast(1.03);
    }

    .img-placeholder {
      width: 100%;
      height: 100%;
      min-height: 90px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 1.5px dashed var(--line-strong);
      border-radius: var(--radius-m);
      background: var(--bg-deep);
      color: var(--ink-faint);
      text-align: center;
      padding: 10px 14px;
      box-sizing: border-box;
    }

    .img-placeholder svg {
      width: 26px;
      height: 26px;
      opacity: .6;
    }

    .img-placeholder .ph-label {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--ink-soft);
    }

    .img-placeholder .ph-hint {
      font-size: 9.5px;
      font-family: var(--mono);
      color: var(--ink-faint);
    }

    html[dir="rtl"] .img-placeholder .ph-hint {
      font-family: var(--sans-fa);
    }

    .tool-logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    footer.slide-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      font-size: 10.5px;
      color: var(--ink-faint);
      font-family: var(--mono);
    }

    html[dir="rtl"] footer.slide-foot {
      font-family: var(--sans-fa);
    }


    /* ===================== BACKGROUND STORY SLIDES ===================== */
    .bg-story,
    .bg-bcr-layout,
    .bg-tki-layout,
    .bg-repurpose-layout {
      flex: 1;
      min-height: 0;
    }

    .bg-story {
      display: grid;
      grid-template-columns: 1.28fr .92fr;
      gap: 22px;
    }

    .bg-hero-visual,
    .bg-story-side,
    .bg-bcr-visual,
    .bg-repurpose-hero,
    .bg-repurpose-side {
      min-height: 0;
    }

    .bg-hero-visual .figure-slot,
    .bg-bcr-visual .figure-slot,
    .bg-repurpose-hero .figure-slot {
      height: 100% !important;
      border-radius: 16px;
      background: #eef3f6;
    }

    .bg-hero-visual img,
    .bg-bcr-visual img,
    .bg-repurpose-hero img {
      object-fit: contain !important;
      padding: 10px;
    }

    .bg-story-side {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 12px;
    }

    .bg-bigword {
      font-family: var(--f-display);
      font-size: clamp(70px, 8vw, 120px);
      line-height: .78;
      font-weight: 600;
      color: var(--blue-deep);
      letter-spacing: -.06em;
    }

    .bg-bigword.small {
      font-size: clamp(44px, 5vw, 72px);
    }

    .bg-kicker {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .13em;
      color: var(--ink-faint);
    }

    html[dir="rtl"] .bg-kicker {
      font-family: var(--sans-fa);
      letter-spacing: normal;
    }

    .bg-headline {
      font-family: var(--f-display);
      font-size: clamp(21px, 2vw, 30px);
      line-height: 1.15;
      color: var(--ink);
      max-width: 15ch;
    }

    .bg-labels {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 4px;
    }

    .bg-labels span {
      border-left: 2px solid var(--blue);
      padding-left: 8px;
      font-size: 11px;
      color: var(--ink-soft);
    }

    .bg-mini-visual {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: auto;
    }

    .bg-mini-visual .figure-slot {
      border-radius: 9px;
    }

    .bg-mini-visual img {
      object-fit: cover !important;
    }

    .bg-bcr-layout {
      display: flex;
      flex-direction: column;
      gap: 16px;
      justify-content: center;
    }

    .bg-bcr-visual {
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 18px;
      align-items: center;
    }

    .bg-bcr-visual .figure-slot {
      height: 270px !important;
    }

    .bg-bcr-visual img {
      object-fit: contain !important;
      padding: 8px;
    }

    .bg-equation {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      font-family: var(--mono);
      font-size: clamp(17px, 2vw, 26px);
      color: var(--ink);
    }

    .bg-equation b {
      color: var(--gold);
      font-weight: 500;
    }

    .bg-bcr-bottom {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .bg-bcr-card {
      border-top: 2px solid var(--line-strong);
      padding: 12px 4px 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .bg-bcr-card.featured {
      border-color: var(--blue);
    }

    .bg-index {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--ink-faint);
    }

    .bg-bcr-card strong {
      font-size: 15px;
      color: var(--ink);
    }

    .bg-bcr-card span {
      font-size: 11px;
      color: var(--ink-faint);
    }

    .bg-tki-layout {
      display: grid;
      grid-template-columns: 1fr 150px 1fr;
      gap: 18px;
      align-items: center;
    }

    .bg-tki-column {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .bg-tki-column .figure-slot {
      height: 210px !important;
    }

    .bg-tki-column img {
      object-fit: contain !important;
      padding: 8px;
    }

    .bg-tki-label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .1em;
    }

    html[dir="rtl"] .bg-tki-label {
      font-family: var(--sans-fa);
      letter-spacing: normal;
    }

    .bg-tki-label.red {
      color: var(--red-deep);
    }

    .bg-tki-label.blue {
      color: var(--blue-deep);
    }

    .bg-tki-column h3 {
      margin: 2px 0 0;
      font-family: var(--f-display);
      font-size: 23px;
      font-weight: 600;
    }

    .bg-mutation {
      display: flex;
      align-items: baseline;
      gap: 8px;
      font-family: var(--mono);
      font-size: 18px;
      color: var(--red-deep);
    }

    .bg-mutation span {
      font-family: var(--f-body);
      font-size: 11px;
      color: var(--ink-faint);
    }

    .bg-mutation.blue-note {
      color: var(--blue-deep);
    }

    .bg-tki-center {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .bg-vs {
      width: 42px;
      height: 42px;
      border: 1px solid var(--line-strong);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--ink-faint);
    }

    .bg-resistance-word {
      font-family: var(--f-display);
      font-size: 22px;
      color: var(--red-deep);
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      letter-spacing: .08em;
    }

    .bg-arrow-line {
      width: 1px;
      height: 48px;
      background: var(--line-strong);
    }

    .bg-opportunity {
      font-size: 10px;
      color: var(--blue-deep);
      writing-mode: vertical-rl;
    }

    .bg-repurpose-layout {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 22px;
      align-items: center;
    }

    .bg-repurpose-hero {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .bg-repurpose-hero .figure-slot {
      height: 330px !important;
    }

    .bg-hero-caption {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .bg-repurpose-side {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .rep-flow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .rep-flow div {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .rep-flow b {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--ink-faint);
    }

    .rep-flow span {
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
    }

    .rep-flow i {
      font-style: normal;
      color: var(--line-strong);
      font-size: 20px;
    }

    .rep-visuals {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .rep-visuals .figure-slot {
      border-radius: 10px;
    }

    .rep-visuals img {
      object-fit: cover !important;
    }

    .bg-bottom-statement {
      border-top: 1px solid var(--line);
      padding-top: 12px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--blue-deep);
    }

    html[dir="rtl"] .bg-bottom-statement {
      font-family: var(--sans-fa);
    }

    @media (max-width:900px) {

      .bg-story,
      .bg-bcr-visual,
      .bg-repurpose-layout {
        grid-template-columns: 1fr;
      }

      .bg-tki-layout {
        grid-template-columns: 1fr;
      }

      .bg-tki-center {
        flex-direction: row;
        justify-content: center;
      }

      .bg-resistance-word,
      .bg-opportunity {
        writing-mode: horizontal-tb;
        transform: none;
      }

      .bg-bcr-bottom {
        grid-template-columns: 1fr;
      }
    }

    /* title slide */
    .title-slide {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      height: 100%;
      gap: 6px;
    }

    .title-slide .kicker {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--blue-deep);
      letter-spacing: .04em;
    }

    html[dir="rtl"] .title-slide .kicker {
      font-family: var(--sans-fa);
    }

    .title-slide h1 {
      font-family: var(--f-display);
      font-size: clamp(30px, 4vw, 56px);
      font-weight: 600;
      margin: 14px 0 6px;
      max-width: 20ch;
      line-height: 1.12;
    }

    .title-slide .sub {
      font-size: 15px;
      color: var(--ink-soft);
      max-width: 60ch;
      margin-bottom: 22px;
    }

    .title-molscape {
      position: absolute;
      inset: 0;
      opacity: .5;
      z-index: 0;
    }

    .title-meta {
      display: flex;
      gap: 26px;
      margin-top: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .title-meta .tm {
      text-align: center;
    }

    .title-meta .tm b {
      display: block;
      font-size: 12.5px;
      color: var(--ink);
    }

    .title-meta .tm span {
      font-size: 14.5px;
      color: var(--ink-faint);
    }

    @media (max-width:900px) {

      .viewer-wrap,
      .cols-2,
      .cols-3 {
        grid-template-columns: 1fr;
      }

      .receptor-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* ===================== CHAPTER DIVIDER SLIDES ===================== */
    .slide.no-pad {
      padding: 0;
    }

    .divider-slide {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #fff;
      overflow: hidden;
    }

    .divider-slide .div-num {
      font-family: var(--mono);
      font-size: 13px;
      opacity: .65;
      letter-spacing: .18em;
      margin-bottom: 18px;
    }

    html[dir="rtl"] .divider-slide .div-num {
      font-family: var(--sans-fa);
      letter-spacing: normal;
    }

    .divider-slide h2 {
      font-family: var(--f-display);
      font-weight: 600;
      font-size: clamp(30px, 4.2vw, 58px);
      margin: 0 0 12px;
      max-width: 20ch;
    }

    .divider-slide p {
      font-size: 14px;
      opacity: .85;
      max-width: 56ch;
      line-height: 1.7;
    }

    .divider-slide .div-icon {
      margin-bottom: 26px;
      opacity: .95;
    }

    .divider-slide .div-bg-pattern {
      position: absolute;
      inset: 0;
      opacity: .12;
    }

    /* Photographic divider background: a blurred, tinted photo behind the chapter title */
    .divider-slide .div-bg-photo {
      position: absolute;
      inset: -16px;
      z-index: 0;
      background-size: cover;
      background-position: center;
      filter: blur(1.8px) saturate(1.15) brightness(1);
    }

    .divider-slide .div-bg-tint {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: linear-gradient(150deg, var(--dv-color) 0%, var(--dv-color) 55%, var(--dv-color) 100%);
      mix-blend-mode: multiply;
      opacity: .82;
    }

    .divider-slide .div-bg-vignette {
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        radial-gradient(120% 85% at 50% 38%, transparent 0%, rgba(8, 12, 17, .42) 100%),
        linear-gradient(0deg, rgba(8, 12, 17, .32), transparent 46%);
    }

    .divider-slide .div-bg-grain {
      position: absolute;
      inset: 0;
      z-index: 1;
      opacity: .5;
      mix-blend-mode: overlay;
      background-image: radial-gradient(1px 1px at 15px 25px, rgba(255, 255, 255, .5) 1px, transparent 0),
        radial-gradient(1px 1px at 75px 65px, rgba(255, 255, 255, .35) 1px, transparent 0);
      background-size: 130px 130px;
    }

    .divider-slide .div-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ===================== TEXT-MASK REVEAL ANIMATION ===================== */
    .word-mask {
      display: inline-block;
      overflow: hidden;
      vertical-align: top;
    }

    .word-mask .word-inner {
      display: inline-block;
      will-change: transform;
    }

    h1.slide-title .word-mask,
    .divider-slide h2 .word-mask,
    .title-slide h1 .word-mask,
    .bg-headline .word-mask,
    .bg-bigword .word-mask {
      padding-bottom: .08em;
      margin-bottom: -.08em;
    }

    /* ===================== MUTATION TOUR SLIDE ===================== */
    .mut-tour-wrap {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      flex: 1;
      min-height: 0;
    }

    .mut-tour-panel {
      position: relative;
      border-radius: var(--radius-m);
      border: 1px solid var(--line);
      overflow: hidden;
      background: var(--bg-deep);
      min-height: 0;
    }

    .mut-tour-panel .mol-container {
      position: absolute;
      inset: 0;
    }

    .mut-tour-tag {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 4;
      display: flex;
      align-items: center;
      gap: 7px;
      font-family: var(--mono);
      font-size: 11px;
      padding: 5px 11px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .88);
      border: 1px solid var(--line);
      color: var(--ink);
    }

    html[dir="rtl"] .mut-tour-tag {
      font-family: var(--sans-fa);
      left: auto;
      right: 10px;
    }

    .mut-tour-tag.before .aa-dot {
      background: var(--blue);
    }

    .mut-tour-tag.after .aa-dot {
      background: var(--gold);
    }

    .mut-tour-tag .aa-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .mut-tour-loading {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 8px;
      color: var(--ink-faint);
      font-size: 11px;
      background: rgba(248, 251, 252, .85);
    }

    .mut-tour-arrow {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 4px;
      color: var(--ink-faint);
      font-family: var(--mono);
      font-size: 10px;
    }

    .aa-props-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11.5px;
    }

    .aa-props-table th {
      text-align: start;
      font-family: var(--mono);
      font-size: 9.5px;
      color: var(--ink-faint);
      padding: 6px 8px;
      border-bottom: 1px solid var(--line-strong);
    }

    html[dir="rtl"] .aa-props-table th {
      font-family: var(--sans-fa);
    }

    .aa-props-table td {
      padding: 6px 8px;
      border-bottom: 1px solid var(--line);
      color: var(--ink-soft);
    }

    .aa-props-table td:first-child {
      color: var(--ink);
      font-weight: 600;
    }

    /* ===================== 3D ROTATING MOLECULE (CSS-only) ===================== */
    .mol3d-spin-wrap {
      perspective: 600px;
      display: inline-block;
    }

    .mol3d-spin {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      animation: mol3d-rotate 9s linear infinite;
    }

    @keyframes mol3d-rotate {
      from {
        transform: rotateY(0deg) rotateX(8deg);
      }

      to {
        transform: rotateY(360deg) rotateX(8deg);
      }
    }

    .mol3d-atom {
      position: absolute;
      border-radius: 50%;
    }

    .mol3d-bond {
      position: absolute;
      transform-style: preserve-3d;
    }

    /* ===================== SLIDE OVERVIEW ===================== */

    #slide-counter {
      appearance: none;
      -webkit-appearance: none;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--ink-faint);
      background: rgba(255, 255, 255, .7);
      backdrop-filter: blur(6px);
      padding: 5px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      cursor: pointer;
      transition: .2s ease;
    }

    #slide-counter:hover {
      color: var(--ink);
      border-color: var(--blue);
      background: var(--surface);
      box-shadow: var(--shadow-1);
    }

    #slide-counter:active {
      transform: translateX(-50%) scale(.96);
    }

    .counter-divider {
      margin: 0 3px;
      opacity: .5;
    }


    /* =========================================================
   SLIDE OVERVIEW
   ========================================================= */

    #slide-overview {
      position: fixed;
      inset: 0;
      z-index: 1000;

      display: none;
      background: rgba(15, 22, 30, 0.42);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      padding: 28px;
    }

    #slide-overview.open {
      display: flex;
      animation: overviewFade .18s ease-out;
    }

    @keyframes overviewFade {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }


    /* Main panel */

    .overview-panel {
      width: min(1400px, 100%);
      height: min(900px, calc(100vh - 56px));

      margin: auto;

      background: #f8f9fa;
      border: 1px solid rgba(30, 45, 60, .14);
      border-radius: 18px;

      box-shadow:
        0 30px 80px rgba(0, 0, 0, .20),
        0 4px 20px rgba(0, 0, 0, .08);

      display: flex;
      flex-direction: column;

      overflow: hidden;
    }


    /* Header */

    .overview-header {
      flex: 0 0 auto;

      padding: 18px 22px;

      border-bottom: 1px solid var(--line);

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .overview-header h2 {
      margin: 0;
      font-family: var(--serif);
      font-size: 26px;
      line-height: 1.1;
    }

    .overview-header .eyebrow {
      margin-bottom: 4px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--blue);
    }


    /* Close button */

    .overview-close {
      width: 38px;
      height: 38px;

      border-radius: 50%;
      border: 1px solid var(--line);

      background: white;
      color: var(--ink-soft);

      font-size: 25px;
      line-height: 1;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      transition: .15s ease;
    }

    .overview-close:hover {
      background: var(--ink);
      color: white;
      transform: rotate(90deg);
    }


    /* =========================================================
   GRID
   ========================================================= */

    #overview-grid {
      flex: 1;
      min-height: 0;

      overflow-y: auto;
      overflow-x: hidden;

      padding: 22px;

      display: grid;

      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;

      align-content: start;

      scrollbar-width: thin;
    }


    /* =========================================================
   THUMBNAIL
   ========================================================= */

    .overview-item {
      min-width: 0;

    }


    /* Number + section */

    .overview-meta {
      height: 26px;

      display: flex;
      align-items: center;
      gap: 8px;

      margin-bottom: 7px;

      font-family: var(--mono);
      font-size: 9px;
      color: var(--ink-soft);
    }

    .overview-number {
      width: 24px;
      height: 24px;

      border-radius: 50%;

      background: #263440;
      color: white;

      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0.3rem;

      font-size: 9px;
      font-weight: 700;
    }

    .overview-section {
      padding: 5px 10px;

      border-radius: 999px;

      background: #e1e5e7;
      color: #315d73;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }


    /* Thumbnail frame */

    .overview-thumb {
      position: relative;

      width: 100%;
      aspect-ratio: 16 / 9;

      overflow: hidden;

      border-radius: 10px;
      border: 1px solid #d5dde2;

      background: #fff;

      cursor: pointer;

      box-shadow: 0 2px 7px rgba(26, 40, 20, 0.79);

      transition:
        transform .18s ease,
        box-shadow .18s ease,
        border-color .18s ease;
    }

    .overview-thumb:hover {
      transform: translateY(-3px);

      border-color: #7c9aaa;

      box-shadow:
        0 8px 24px rgba(20, 30, 40, .14);
    }


    /* =========================================================
   IMPORTANT:
   Scale the REAL slide down instead of letting it control
   the overview layout.
   ========================================================= */

    .overview-thumb>.slide {
      position: absolute !important;

      /*
   * The actual slide is 5× larger than the thumbnail,
   * then scaled back down.
   */
      width: 500% !important;
      height: 500% !important;

      inset: 0 !important;

      padding: 3.6% 5.2% !important;

      transform: scale(.2);
      transform-origin: top left;

      overflow: hidden !important;

      pointer-events: none;
    }


    /* Don't let interactive elements interfere */

    .overview-thumb button,
    .overview-thumb canvas,
    .overview-thumb .viewer,
    .overview-thumb .viewer-wrap {
      pointer-events: none !important;
    }


    /* Current slide */

    .overview-item.current .overview-thumb {
      border: 2px solid var(--blue);

      box-shadow:
        0 0 0 3px rgba(44, 110, 142, .13),
        0 10px 28px rgba(44, 110, 142, .16);
    }

    .overview-item.current .overview-number {
      background: var(--blue);
    }

    .overview-card {
      background-color: #fff;
      border: none;
    }

    /* Current label */

    .overview-current {
      position: absolute;

      top: 8px;
      right: 8px;

      z-index: 20;

      padding: 4px 8px;

      border-radius: 999px;

      background: var(--blue);
      color: white;

      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: .08em;
    }


    /* =========================================================
   RESPONSIVE
   ========================================================= */

    @media (max-width: 1000px) {
      #slide-overview {
        padding: 16px;
      }

      #overview-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }
    }

    @media (max-width: 600px) {
      #slide-overview {
        padding: 8px;
      }

      .overview-panel {
        height: calc(100vh - 16px);
        border-radius: 12px;
      }

      #overview-grid {
        grid-template-columns: 1fr;
        padding: 14px;
      }
    }

    /* ===================== MOTION SYSTEM ===================== */
    .slide.motion-prep {
      visibility: visible;
    }

    .slide [data-motion],
    .slide .card,
    .slide .figure-slot,
    .slide .panel,
    .slide .metric,
    .slide .chip,
    .slide .table-wrap,
    .slide .chart-wrap,
    .slide .section-label,
    .slide .method-step,
    .slide .bg-story>*,
    .slide .bg-bcr-card,
    .slide .bg-tki-column,
    .slide .bg-tki-center,
    .slide .rep-flow,
    .slide .rep-visuals {
      will-change: transform, opacity;
    }

    /* Keep motion elegant rather than flashy. */
    @media (prefers-reduced-motion: reduce) {
      .slide {
        transition: none !important;
      }

      .slide *,
      .slide::before {
        animation: none !important;
        transition: none !important;
      }
    }

    .scroll-hint {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      pointer-events: none;
      opacity: .5;
      font: 9px var(--mono);
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .scroll-hint .mouse {
      width: 18px;
      height: 28px;
      border: 1px solid currentColor;
      border-radius: 12px;
      position: relative;
    }

    .scroll-hint .mouse::after {
      content: "";
      position: absolute;
      width: 2px;
      height: 5px;
      border-radius: 2px;
      background: currentColor;
      left: 7px;
      top: 5px;
    }

    .scroll-hint.hide {
      opacity: 0;
    }
  
    /* ===================== PATCH: slide 11 — single-viewer mutation tour ===================== */
    .mut-tour-wrap { grid-template-columns: 1.6fr 1fr; }
    .mt-controls { right: 10px; flex-wrap: wrap; }
    html[dir="rtl"] .mt-controls { left: 10px; right: 10px; }
    .mt-controls .btn { background: rgba(255, 255, 255, .92); }
    .mt-controls .btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }

    .divider-slide .div-bg-photo { filter: blur(1.6px) saturate(1.35) brightness(1.3) contrast(1.06); }
    .divider-slide .div-bg-tint { opacity: .58; }
    .divider-slide .div-bg-vignette {

    .divider-slide::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      mix-blend-mode: screen;
      background:
        radial-gradient(60% 55% at 50% 36%, rgba(255, 255, 255, .32), transparent 70%),
        linear-gradient(200deg, rgba(255, 255, 255, .16), transparent 42%);
    }
    .divider-slide h2, .divider-slide p, .divider-slide .div-num { text-shadow: 0 2px 18px rgba(8, 12, 17, .45); }

    /* ===================== PATCH: slide 7 — PZQ clip fix + 2D structure ===================== */
    /* the word-mask used to clip the top of the big "PZQ" because of line-height:.78 */
    .bg-bigword .word-mask { padding: .16em .06em .12em 0; margin: -.16em -.06em -.12em 0; }
    .bg-hero-caption { position: relative; z-index: 2; }
    .pzq-2d {
      position: relative;
      height: 330px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: radial-gradient(70% 80% at 50% 45%, #ffffff 0%, #eef3f6 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      overflow: hidden;
    }
    .pzq-2d .rdkit-mol { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    .pzq-2d .rdkit-mol svg { width: 100%; height: 100%; }
    .pzq-2d-tag {
      position: absolute;
      left: 14px;
      bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 11px;
      color: var(--ink-faint);
      font-family: var(--mono);
    }
    .pzq-2d-tag b { font-family: var(--f-body); font-size: 13px; color: var(--ink); }
    html[dir="rtl"] .pzq-2d-tag { left: auto; right: 14px; }

    /* ===================== PATCH: slide 5 — scroll-driven tabs ===================== */
    .bcr-stage { position: relative; height: 270px; }
    .bcr-img {
      position: absolute;
      inset: 0;
      opacity: 0;
      transform: scale(1.03);
      transition: opacity .6s ease, transform .8s ease;
      pointer-events: none;
    }
    .bcr-img.on { opacity: 1; transform: none; }
    .bcr-side { display: flex; flex-direction: column; gap: 14px; }
    .bcr-eq { opacity: .35; transition: opacity .4s ease, color .4s ease; }
    .bcr-eq.on { opacity: 1; color: var(--blue-deep); }
    .bcr-caption { margin: 0; min-height: 5.2em; }
    .bcr-hint { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; color: var(--ink-faint); text-transform: uppercase; }
    html[dir="rtl"] .bcr-hint { font-family: var(--sans-fa); letter-spacing: normal; }
    .bg-bcr-card { border-top-width: 3px; cursor: pointer; opacity: .5; transition: opacity .4s ease, border-color .4s ease; }
    .bg-bcr-card:hover { opacity: .85; }
    .bg-bcr-card.on { border-top-color: var(--blue); opacity: 1; }
    .bg-bcr-card.on strong { color: var(--blue-deep); }
  </style>
</head>

    /* -------- 3Dmol.js viewer engine -------- */
    let glviewer = null;
    let currentReceptorKey = null;
    function initMolViewer(receptorKey) {
      currentReceptorKey = receptorKey;
      const r = RECEPTORS[receptorKey];
      const el = document.getElementById("mol3d");
      if (!el) return;
      const loadEl = document.getElementById("vload");
      el.innerHTML = "";
      glviewer = $3Dmol.createViewer(el, { backgroundColor: "rgba(0,0,0,0)", antialias: true });
      // Keep the 3Dmol canvas completely transparent so the slide itself provides the visual background.
      if (glviewer.setBackgroundColor) glviewer.setBackgroundColor("rgba(0,0,0,0)", 0);
      const url = window.RECEPTORS_PATH + r.file;
      fetch(url).then(res => {
        if (!res.ok) throw new Error("not found");
        return res.text();
      }).then(pdbText => {
        renderMolecule(pdbText, receptorKey);
        if (loadEl) loadEl.style.display = "none";
      }).catch(() => {
        if (loadEl) loadEl.innerHTML = `<div style="text-align:center; max-width:80%;">
      <div style="font-size:22px; margin-bottom:6px;">&#9888;</div>
      ${L('Could not find', 'فایل یافت نشد')} <code style="font-family:var(--mono); background:var(--bg-deep); padding:2px 6px; border-radius:4px;">${window.RECEPTORS_PATH}${r.file}</code>.<br>
      <span style="font-size:11px;">${L('Place the PDB file in the receptors folder and reload.', 'فایل PDB را در پوشه receptors قرار داده و صفحه را مجدداً بارگذاری کنید.')}</span></div>`;
      });
    }
    function classifySite(coord, key) {
      const boxes = GRID_BOXES[key];
      const d = (a, b) => Math.sqrt((a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2 + (a[2] - b[2]) ** 2);
      const dAllo = d(coord, boxes.allosteric), dCat = d(coord, boxes.catalytic);
      return dAllo < dCat ? "allosteric" : "catalytic";
    }
    let siteSelections = {}; // populated per-render: {allosteric: <3Dmol selector>, catalytic: <3Dmol selector>}
    function renderMolecule(pdbText, receptorKey) {
      glviewer.clear();
      siteSelections = {};
      const model = glviewer.addModel(pdbText, "pdb");
      // protein: cartoon ribbon, muted academic gray-blue — ligands get licorice below
      glviewer.setStyle({ hetflag: false }, { cartoon: { color: "#AEBCC7", thickness: 0.35, opacity: 0.96 } });

      // find hetero groups (exclude water/ions) and classify by nearest grid-box centre
      const atoms = model.selectedAtoms({ hetflag: true });
      const groups = {};
      atoms.forEach(a => {
        if (["HOH", "WAT", "NA", "CL", "MG", "ZN", "K", "CA", "MN"].includes(a.resn)) return;
        const key = a.resn + "_" + a.chain + "_" + a.resi;
        if (!groups[key]) groups[key] = [];
        groups[key].push(a);
      });
      Object.keys(groups).forEach(k => {
        const grp = groups[k];
        if (grp.length < 5) return; // skip stray ions/small hetero groups, keep real ligands
        const cx = grp.reduce((s, a) => s + a.x, 0) / grp.length;
        const cy = grp.reduce((s, a) => s + a.y, 0) / grp.length;
        const cz = grp.reduce((s, a) => s + a.z, 0) / grp.length;
        const site = classifySite([cx, cy, cz], receptorKey);
        const sel = { resn: grp[0].resn, resi: grp[0].resi, chain: grp[0].chain };
        // pure licorice (stick-only) representation for the cognate ligand
        glviewer.setStyle(sel, { stick: { colorscheme: site === "allosteric" ? "cyanCarbon" : "redCarbon", radius: 0.24 } });
        siteSelections[site] = sel; // remember for the "go to site" buttons

        // label the ligand directly in the structure with its real name
        const r0 = RECEPTORS[receptorKey];
        const ligandName = site === "allosteric" ? L(r0.alloLig_en, r0.alloLig_fa) : L(r0.catLig_en, r0.catLig_fa);
        glviewer.addLabel(ligandName, {
          position: { x: cx, y: cy, z: cz },
          backgroundColor: site === "allosteric" ? "#2C6E8E" : "#B24A3B",
          backgroundOpacity: 0.85, fontColor: "#fff", fontSize: 11, borderRadius: 4,
          inFront: true, showBackground: true
        });
      });

      // mutation highlight — licorice + label, no extra spheres
      const r = RECEPTORS[receptorKey];
      if (r.mutation) {
        const msel = { resi: r.mutation.resi };
        glviewer.setStyle(msel, { stick: { colorscheme: "yellowCarbon", radius: 0.28 } });
        glviewer.addLabel(r.mutation.label, { position: { resi: r.mutation.resi }, backgroundColor: "#B5872F", backgroundOpacity: 0.9, fontColor: "#fff", fontSize: 12, borderRadius: 4 }, msel);
      }
      glviewer.zoomTo();
      glviewer.render();
      glviewer.spin(false);
      playIntroSequence(receptorKey);
    }
    let introTimers = [];
    function clearIntro() { introTimers.forEach(t => clearTimeout(t)); introTimers = []; }
    function playIntroSequence(receptorKey) {
      clearIntro();

        if (alloSel) glviewer.zoomTo(alloSel, 1000); else glviewer.zoomTo();

    function heatColor(v) {

      const r1 = 222, g1 = 234, b1 = 240, r2 = 44, g2 = 110, b2 = 142; // light -> blue-deep
      const r = Math.round(r1 + (r2 - r1) * t), g = Math.round(g1 + (g2 - g1) * t), b = Math.round(b1 + (b2 - b1) * t);
      return `rgb(${r},${g},${b})`;

        const t = i / MD_N;
        rmsd.push(0.05 + (0.25 - 0.05) * (1 - Math.exp(-t * 7)) + (Math.sin(i * 0.9) * 0.012));
        rg.push(2.15 + Math.sin(i * 0.5) * 0.02 + (Math.random() * 0.006 - 0.003));
      }
      for (let i = 0; i < 40; i++) { rmsf.push(0.06 + 0.22 * Math.pow(Math.sin(i / 40 * Math.PI * 2.4), 2) + (i > 26 && i < 34 ? 0.35 : 0)); }

    function drawMdCharts(upto) {
      const n = upto || MD_N;

        const ctx = document.getElementById(id); if (!ctx) return null;
        if (window["_ch_" + id]) window["_ch_" + id].destroy();
        window["_ch_" + id] = new Chart(ctx, {
          type: 'line',

            plugins: { legend: { display: false } }

        });
        return window["_ch_" + id];
      };
      mk('chart-rmsd', MD_DATA.rmsd, '#2C6E8E', 'RMSD', 0.4);

    function mol3dSpinner(size, palette) {
      size = size || 120;
      const pal = palette || ['#2C6E8E', '#B24A3B', '#2C6E8E', '#B5872F', '#2C6E8E', '#6C5B8C'];
      const atoms = [
        { x: 0, y: -32, z: 22, r: 13 }, { x: 28, y: -16, z: 0, r: 10 }, { x: 28, y: 16, z: -22, r: 13 },
        { x: 0, y: 32, z: 0, r: 10 }, { x: -28, y: 16, z: 22, r: 13 }, { x: -28, y: -16, z: -10, r: 10 },
      ];
      const half = size / 2;
      const atomsHTML = atoms.map((a, i) => `<div class="mol3d-atom" style="width:${a.r * 2}px;height:${a.r * 2}px;left:${(half + a.x - a.r).toFixed(1)}px;top:${(half + a.y - a.r).toFixed(1)}px;background:${pal[i % pal.length]};box-shadow:inset -3px -3px 7px rgba(0,0,0,.28), 0 0 12px ${pal[i % pal.length]}66; transform:translateZ(${a.z}px);"></div>`).join("");
      return `<div class="mol3d-spin-wrap" style="width:${size}px;height:${size}px;">
    <div class="mol3d-spin" style="width:${size}px;height:${size}px;">${atomsHTML}</div>
  </div>`;
    }

    function figureSlot(file, labelEn, labelFa, opts) {
      opts = opts || {};

      const camera = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.4"/></svg>`;
      return `<div class="figure-slot" style="height:${h}px; --fig-img:url('./images/${file}');">
        <img src="./images/${file}" alt="${labelEn}"
             onerror="this.parentElement.style.setProperty('--fig-img','none'); this.outerHTML = imgPlaceholderHTML('${labelEn.replace(/'/g, "\\'")}','${labelFa.replace(/'/g, "\\'")}','${file}')">

      { key: "md-trajectory", sec: () => L("Molecular Dynamics", "دینامیک مولکولی"), build: () => shell({ eyebrow: L("04 · MD", "۰۴ · دینامیک مولکولی"), title: L("Live trajectory metrics", "معیارهای زنده تراژکتوری"), body: slideMdTrajectory(), foot: FOOT("18") }), after: () => drawMdCharts() },
      { key: "md-gbsa", sec: () => L("Molecular Dynamics", "دینامیک مولکولی"), build: () => shell({ eyebrow: L("04 · MD", "۰۴ · دینامیک مولکولی"), title: L("MM/GBSA free-energy decomposition", "تجزیه انرژی آزاد MM/GBSA"), body: slideMmgbsa(), foot: FOOT("19") }), after: drawGbsaChart },
      { key: "div-dft", sec: "", bare: true, divider: true, build: () => slideDivider({ num: "05", en: "DFT Calculations", fa: "محاسبات DFT", dEn: "Asking whether praziquantel is electronically predisposed to this kind of stable binding.", dFa: "بررسی این‌که آیا پرازیکوانتل از نظر الکترونی مستعد چنین اتصال پایداری است یا خیر.", color: "#4A3D68", icon: "atom", img: "bg-dft.jpg" }) },
      { key: "dft-methods", sec: () => L("DFT", "DFT"), build: () => shell({ eyebrow: L("05 · DFT", "۰۵ · DFT"), title: L("DFT methodology", "روش‌شناسی DFT"), body: slideDftMethods(), foot: FOOT("20") }) },
      { key: "dft-results", sec: () => L("DFT", "DFT"), build: () => shell({ eyebrow: L("05 · DFT", "۰۵ · DFT"), title: L("Electronic reactivity of praziquantel", "واکنش‌پذیری الکترونی پرازیکوانتل"), body: slideDftResults(), foot: FOOT("21") }) },
      { key: "div-discussion", sec: "", bare: true, divider: true, build: () => slideDivider({ num: "06", en: "Discussion & Conclusion", fa: "بحث و نتیجه‌گیری", dEn: "Bringing docking, MD and DFT together, comparing candidates, and weighing the limitations.", dFa: "جمع‌بندی داکینگ، MD و DFT، مقایسه کاندیداها و بررسی محدودیت‌ها.", color: "#182533", icon: "check", img: "bg-discussion.jpg" }) },
      { key: "convergence", sec: () => L("Synthesis", "جمع‌بندی"), build: () => shell({ eyebrow: L("06 · Synthesis", "۰۶ · جمع‌بندی"), title: L("Three-level convergence", "همگرایی سه‌سطحی"), body: slideConvergence(), foot: FOOT("22") }) },
      { key: "comparison", sec: () => L("Discussion", "بحث"), build: () => shell({ eyebrow: L("07 · Discussion", "۰۷ · بحث"), title: L("Praziquantel vs. other candidates", "پرازیکوانتل در برابر سایر کاندیداها"), body: slideComparison(), foot: FOOT("23") }) },
      { key: "admet", sec: () => L("Discussion", "بحث"), build: () => shell({ eyebrow: L("07 · Discussion", "۰۷ · بحث"), title: L("ADMET & druggability", "ADMET و دارورسانی"), body: slideAdmet(), foot: FOOT("24") }) },
      { key: "mechanism", sec: () => L("Discussion", "بحث"), build: () => shell({ eyebrow: L("07 · Discussion", "۰۷ · بحث"), title: L("Proposed allosteric mechanism", "مکانیسم آلوستریک پیشنهادی"), body: slideMechanism(), foot: FOOT("25") }) },
      { key: "limitations", sec: () => L("Discussion", "بحث"), build: () => shell({ eyebrow: L("07 · Discussion", "۰۷ · بحث"), title: L("Limitations", "محدودیت‌ها"), body: slideLimitations(), foot: FOOT("26") }) },
      { key: "conclusion", sec: () => L("Conclusion", "نتیجه‌گیری"), build: () => shell({ eyebrow: L("08 · Conclusion", "۰۸ · نتیجه‌گیری"), title: L("Conclusion & outlook", "نتیجه‌گیری و چشم‌انداز"), body: slideConclusion(), foot: FOOT("27") }) },
      { key: "thanks", sec: "", build: slideThanks, bare: true },
    ];

    /* =========================================================================
       RENDER / NAVIGATION ENGINE
       ========================================================================= */
    let motionBusy = false;
    let firstRender = true;

    /* Wrap each word of a headline in a mask/inner span pair so it can be
       revealed with a clip-and-rise motion — a lightweight stand-in for
       GSAP's SplitText plugin using nothing but native DOM + GSAP tweens. */
    function splitTextMask(el) {
      if (!el || el.dataset.split) return;
      const text = el.textContent;
      if (!text || !text.trim()) return;
      el.dataset.split = '1';
      el.innerHTML = text.split(/(\s+)/).map(tok => {
        if (!tok.trim()) return tok;
        return `<span class="word-mask"><span class="word-inner">${tok}</span></span>`;
      }).join('');
    }

    function animateSlideIn(el, dir = 1) {
      if (!window.gsap || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        el.classList.add('active');
        return;
      }

      el.classList.add('motion-prep');
      el.classList.add('active');

      const rtl = currentLang === 'fa';
      const sign = (dir >= 0 ? 1 : -1) * (rtl ? -1 : 1);

      // Split headline-level text into word masks before animating.
      const headlineEls = el.querySelectorAll(
        'h1.slide-title, .divider-slide h2, .title-slide h1, .bg-headline, .bg-bigword'
      );
      headlineEls.forEach(splitTextMask);

      const children = el.querySelectorAll(
        '.eyebrow, .slide-sub, .slide > .grow, .slide-foot, '
        + '.title-slide > *, .divider-slide .div-num, .divider-slide p, .bg-story > *, .bg-bcr-layout > *, '
        + '.bg-bcr-card, .bg-tki-column, .bg-tki-center, .rep-flow, .rep-visuals, '
        + '.card, .panel, .metric, .chart-wrap, .table-wrap, .method-step, [data-motion]'
      );

      // First pass: bring the slide itself in with a restrained directional drift.
      gsap.fromTo(el,
        { autoAlpha: 0, x: sign * 26, y: 10, scale: .985 },
        { autoAlpha: 1, x: 0, y: 0, scale: 1, duration: .62, ease: 'power3.out' }
      );

      // Headline words rise out of their masks in a quick, orchestrated cascade.
      const words = el.querySelectorAll('.word-mask .word-inner');
      if (words.length) {
        gsap.fromTo(words,
          { yPercent: 108, autoAlpha: 0 },
          { yPercent: 0, autoAlpha: 1, duration: .68, stagger: .022, delay: .1, ease: 'power4.out' }
        );
      }

      // Second pass: stagger the remaining content so the eye gets a clear reading order.
      if (children.length) {
        gsap.fromTo(children,
          { autoAlpha: 0, y: 18, x: sign * 10 },
          { autoAlpha: 1, y: 0, x: 0, duration: .58, stagger: .045, delay: .16, ease: 'power3.out', clearProps: 'transform,opacity' }
        );
      }

      // Hero images / molecular views get a slower, subtle scale reveal.
      const heroes = el.querySelectorAll('.figure-slot img, .bg-hero-visual img, .bg-bcr-visual img, .rep-hero, .viewer-box, .divider-slide .div-bg-photo');
      if (heroes.length) {
        gsap.fromTo(heroes, { scale: 1.09, autoAlpha: .5 }, { scale: 1, autoAlpha: 1, duration: 1.1, delay: .04, ease: 'power2.out', clearProps: 'opacity' });
      }
    }

    function prepareVerticalScroll(el) {
      if (!el) return;
      const containers = el.querySelectorAll('.scroll-y');
      if (!containers.length) return;

      containers.forEach((box) => {
        box.classList.add('scroll-motion');

        const updateState = () => {
          const canScroll = box.scrollHeight > box.clientHeight + 4;
          box.classList.toggle('has-scroll', canScroll);
          const atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 6;
          const hint = box.querySelector('.vertical-scroll-hint');
          if (hint) hint.classList.toggle('done', !canScroll || atBottom);
        };

        // Give long content a subtle entrance as it becomes visible.
        const items = Array.from(box.children).filter(node =>
          !node.classList.contains('vertical-scroll-hint')
        );

        if (window.gsap && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          items.forEach((item, i) => {
            item.classList.add('scroll-reveal');
            gsap.fromTo(item,
              { autoAlpha: .45, y: 18 },
              { autoAlpha: 1, y: 0, duration: .55, delay: Math.min(i * .035, .18), ease: 'power2.out', clearProps: 'transform,opacity' }
            );
          });
        }

        box.addEventListener('scroll', updateState, { passive: true });
        requestAnimationFrame(updateState);

        if (box.scrollHeight > box.clientHeight + 4 && !box.querySelector('.vertical-scroll-hint')) {
          const hint = document.createElement('div');
          hint.className = 'vertical-scroll-hint';
          hint.textContent = currentLang === 'fa' ? 'SCROLL ↓' : 'SCROLL ↓';
          box.appendChild(hint);
          updateState();
        }
      });
    }

    function canConsumeVerticalScroll(target, deltaY) {
      const box = target && target.closest ? target.closest('.scroll-y') : null;
      if (!box) return false;
      const max = box.scrollHeight - box.clientHeight;
      if (max <= 2) return false;
      const atTop = box.scrollTop <= 1;
      const atBottom = box.scrollTop >= max - 1;
      return deltaY < 0 ? !atTop : !atBottom;
    }

    function renderSlide(dir = 1) {
      clearInterval(mdTimer); mdPlaying = false;
      if (typeof clearIntro === 'function') clearIntro();
      const vp = document.getElementById("slide-viewport");
      const s = SLIDES[currentSlide];
      const old = vp.querySelector('.slide');
      const el = document.createElement("div");
      el.className = "slide" + (s.divider ? " no-pad" : "");
      if (s.enter) s.enter(dir);
      el.innerHTML = s.build();

      const commit = () => {
        vp.innerHTML = "";
        vp.appendChild(el);
        animateSlideIn(el, dir);
        prepareVerticalScroll(el);

        document.getElementById("counter-current").textContent = currentSlide + 1;
        document.getElementById("counter-total").textContent = SLIDES.length;
        document.getElementById("progress-fill").style.width = ((currentSlide + 1) / SLIDES.length * 100) + "%";
        const langToggleEl = document.getElementById("lang-toggle");
        if (langToggleEl) langToggleEl.style.display = (currentSlide === 0) ? "flex" : "none";
        updateLangUI();
        const hint = document.getElementById('scroll-hint');
        if (hint) hint.classList.toggle('hide', currentSlide > 1);
        if (s.after) setTimeout(s.after, 90);
        motionBusy = false;
        firstRender = false;
      };

      if (old && window.gsap && !firstRender && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        motionBusy = true;
        const rtl = currentLang === 'fa';
        const sign = (dir >= 0 ? 1 : -1) * (rtl ? -1 : 1);
        gsap.to(old, {
          autoAlpha: 0,
          x: sign * -30,
          y: -5,
          scale: .985,
          duration: .34,
          ease: 'power2.in',
          onComplete: commit
        });
      } else {
        commit();
      }
    }
    function jump(i) {
      if (motionBusy || i === currentSlide) return;
      const dir = i > currentSlide ? 1 : -1;
      currentSlide = i;
      renderSlide(dir);
    }
    function go(delta) {
      if (motionBusy) return;
      const next = currentSlide + delta;
      if (next < 0 || next >= SLIDES.length) return;
      currentSlide = next;
      renderSlide(delta >= 0 ? 1 : -1);
    }
    function toggleLang() {
      currentLang = currentLang === "en" ? "fa" : "en";
      document.getElementById("html-root").setAttribute("lang", currentLang);
      document.getElementById("html-root").setAttribute("dir", currentLang === "fa" ? "rtl" : "ltr");
      document.getElementById("html-root").setAttribute("data-lang", currentLang);
      renderSlide();
    }
    function updateLangUI() {
      document.getElementById("opt-en").className = "opt" + (currentLang === "en" ? " on" : "");
      document.getElementById("opt-fa").className = "opt" + (currentLang === "fa" ? " on" : "");
    }

    /* keyboard */
    document.addEventListener("keydown", (e) => {

      if (e.key === "Escape" && overviewOpen) {
        closeOverview();
        return;
      }

      if (e.key === "ArrowRight") {
        go(currentLang === "fa" ? -1 : 1);
      }

      else if (e.key === "ArrowLeft") {
        go(currentLang === "fa" ? 1 : -1);
      }

      else if (e.key === "f" || e.key === "F") {
        if (!document.fullscreenElement)
          document.getElementById("deck-frame").requestFullscreen?.();
        else
          document.exitFullscreen?.();
      }
    });
    /* swipe / gesture */
    let touchStartX = null;
    document.addEventListener("touchstart", (e) => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
    document.addEventListener("touchend", (e) => {
      if (touchStartX === null) return;
      const dx = e.changedTouches[0].screenX - touchStartX;
      if (Math.abs(dx) > 60) {
        const forward = dx < 0;
        go(forward ? (currentLang === "fa" ? -1 : 1) : (currentLang === "fa" ? 1 : -1));
      }
      touchStartX = null;
    }, { passive: true });
    /* mouse wheel (subtle, debounced) */
    let wheelLock = false;
    document.getElementById("stage").addEventListener("wheel", (e) => {
      if (Math.abs(e.deltaY) < 10) return;

      // A vertically scrollable slide gets priority. Only when the user reaches
      // its top/bottom edge does the wheel continue to the previous/next slide.
      if (canConsumeVerticalScroll(e.target, e.deltaY)) return;

      // Slide 5: the wheel walks through the three tabs before moving to another slide.
      if (SLIDES[currentSlide].key === "bg-bcrabl" && !motionBusy) {
        const nxt = bcrStep + (e.deltaY > 0 ? 1 : -1);
        if (nxt >= 0 && nxt < BCR_STEPS.length) {
          if (!wheelLock) { wheelLock = true; setBcrStep(nxt); setTimeout(() => wheelLock = false, 650); }
          return;
        }
      }

      if (wheelLock || motionBusy) return;
      wheelLock = true;
      go(e.deltaY > 0 ? 1 : -1);
      setTimeout(() => wheelLock = false, 700);
    }, { passive: true });

    /* boot */
    window.addEventListener("load", () => { renderSlide(); });

    /* =========================================================================
   SLIDE OVERVIEW
   ========================================================================= */

    let overviewOpen = false;

    function toggleOverview() {
      overviewOpen = !overviewOpen;

      const overlay = document.getElementById("slide-overview");

      if (overviewOpen) {
        buildOverview();
        overlay.classList.add("open");
        overlay.setAttribute("aria-hidden", "false");
      } else {
        overlay.classList.remove("open");
        overlay.setAttribute("aria-hidden", "true");
      }
    }


    function closeOverview() {
      overviewOpen = false;

      const overlay = document.getElementById("slide-overview");

      overlay.classList.remove("open");
      overlay.setAttribute("aria-hidden", "true");
    }


    function buildOverview() {
      const grid = document.getElementById("overview-grid");

      if (!grid) return;

      grid.innerHTML = "";

      SLIDES.forEach((slide, index) => {

        const card = document.createElement("button");

        card.type = "button";

        card.className =
          "overview-card" +
          (index === currentSlide ? " current" : "") +
          (slide.divider ? " divider-card" : "");

        card.setAttribute(
          "aria-label",
          `Go to slide ${index + 1}`
        );

        /*
         * Render the actual slide into a miniature container.
         */
        const thumb = document.createElement("div");
        thumb.className = "overview-thumb";

        const inner = document.createElement("div");
        inner.className = "overview-thumb-inner";

        /*
         * Build the slide using the exact same build() function
         * used by the presentation.
         */
        inner.innerHTML = slide.build();

        /*
         * The slide CSS uses absolute positioning / flex etc.
         * We make the generated slide behave like a miniature
         * presentation slide.
         */
        const miniSlide = inner.querySelector(".slide");

        if (miniSlide) {
          miniSlide.style.cssText += `
        position: absolute;
        inset: 0;
        opacity: 1;
        transform: none;
        pointer-events: none;
        padding: 3.6% 5.2%;
      `;
        }

        thumb.appendChild(inner);

        /*
         * Slide number.
         */
        const number = document.createElement("div");
        number.className = "overview-number";
        number.textContent = index + 1;

        card.appendChild(thumb);
        card.appendChild(number);

        /*
         * Clicking a thumbnail jumps directly to it.
         */
        card.addEventListener("click", () => {
          jump(index);
          closeOverview();
        });

        grid.appendChild(card);
      });

      /*
       * Update overview title according to language.
       */
      const title = document.getElementById("overview-title");
      const kicker = document.getElementById("overview-kicker");

      if (title) {
        title.textContent = L(
          "Slide overview",
          "نمای کلی اسلایدها"
        );
      }

      if (kicker) {
        kicker.textContent = L(
          "PRESENTATION",
          "ارائه"
        );
      }
    }
  </script>
