<!DOCTYPE html>
<html lang="en" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Praziquantel &amp; BCR-ABL — Thesis Defense</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100..900&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/3Dmol/2.1.0/3Dmol-min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@rdkit/rdkit/dist/RDKit_minimal.js"></script>
<style>
/* ===================== DESIGN TOKENS ===================== */
:root{
  --bg:#F5F8FA;
  --bg-deep:#EDF2F5;
  --surface:#FFFFFF;
  --surface-2:#FBFCFD;
  --ink:#182533;
  --ink-soft:#51616F;
  --ink-faint:#8A99A6;
  --line:#DCE4E9;
  --line-strong:#C3CFD7;

  --blue:#2C6E8E;      /* allosteric */
  --blue-deep:#1E4F68;
  --blue-soft:#DEEAF0;
  --red:#B24A3B;       /* catalytic */
  --red-deep:#8C382C;
  --red-soft:#F5E3DE;
  --gold:#B5872F;      /* mutation / highlight */
  --gold-soft:#F3E9D1;
  --green:#3C7A5E;      /* validated / positive */
  --green-soft:#DFEEE6;
  --violet:#6C5B8C;     /* DFT / electronic */
  --violet-soft:#E9E4F1;

  --shadow-1: 0 1px 2px rgba(24,37,51,.06), 0 1px 1px rgba(24,37,51,.04);
  --shadow-2: 0 8px 24px rgba(24,37,51,.10), 0 2px 6px rgba(24,37,51,.06);
  --shadow-3: 0 20px 48px rgba(24,37,51,.16);

  --radius-s: 6px;
  --radius-m: 12px;
  --radius-l: 20px;

  --serif-en: 'Newsreader', 'Vazirmatn', serif;
  --sans-en: 'Inter', 'Vazirmatn', sans-serif;
  --sans-fa: 'Vazirmatn', 'Inter', sans-serif;
  --mono: 'JetBrains Mono', monospace;

  --f-display: var(--serif-en);
  --f-body: var(--sans-en);
}
html[data-lang="fa"]{
  --f-display: var(--sans-fa);
  --f-body: var(--sans-fa);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  background: radial-gradient(1200px 700px at 12% -10%, #eef4f7 0%, var(--bg) 55%), var(--bg);
  color:var(--ink);
  font-family:var(--f-body);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
html[dir="rtl"] body{ font-family:var(--sans-fa); }

::selection{ background:var(--blue-soft); color:var(--blue-deep); }

/* ===================== STAGE / DECK FRAME ===================== */
#stage{
  position:fixed; inset:0;
  display:flex; align-items:center; justify-content:center;
}
#deck-frame{
  position:relative;
  width:min(96vw, 177.78vh);
  height:min(54vw, 100vh);
  max-width:1600px;
  background:var(--surface);
  border-radius:var(--radius-l);
  box-shadow:var(--shadow-3);
  overflow:hidden;
  border:1px solid var(--line);
}
#slide-viewport{
  position:absolute; inset:0;
  overflow:hidden;
}
.slide{
  position:absolute; inset:0;
  display:flex; flex-direction:column;
  padding: 3.6% 5.2%;
  opacity:0; transform:translateY(14px) scale(.99);
  pointer-events:none;
  transition: opacity .5s cubic-bezier(.22,.61,.36,1), transform .5s cubic-bezier(.22,.61,.36,1);
}
.slide.active{
  opacity:1; transform:translateY(0) scale(1);
  pointer-events:auto;
}
.slide-exit-left{ transform:translateY(0) translateX(-30px) scale(.99); }
.slide-exit-right{ transform:translateY(0) translateX(30px) scale(.99); }

/* subtle academic backdrop texture */
.slide::before{
  content:"";
  position:absolute; inset:0;
  background-image:
    radial-gradient(1px 1px at 20px 30px, rgba(44,110,142,.05) 1px, transparent 0),
    radial-gradient(1px 1px at 90px 80px, rgba(178,74,59,.04) 1px, transparent 0);
  background-size: 140px 140px;
  pointer-events:none; z-index:0;
}
.slide > *{ position:relative; z-index:1; }

/* ===================== TYPE SCALE ===================== */
.eyebrow{
  font-family:var(--mono); font-size:11px; letter-spacing:.06em;
  color:var(--blue-deep); text-transform:none;
  display:inline-flex; align-items:center; gap:8px;
  background:var(--blue-soft); padding:5px 12px; border-radius:999px;
  width:fit-content;
}
html[dir="rtl"] .eyebrow{ font-family:var(--sans-fa); }
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--blue);}

h1.slide-title{
  font-family:var(--f-display); font-weight:600;
  font-size:clamp(26px, 2.7vw, 42px);
  line-height:1.15; color:var(--ink); margin:10px 0 4px 0;
  letter-spacing:-.01em;
}
p.slide-sub{
  font-size:clamp(13px,1.15vw,16px); color:var(--ink-soft); margin:0 0 18px 0;
  max-width:74ch; line-height:1.55;
}
.section-tag{ font-size:12px; color:var(--ink-faint); font-family:var(--mono); }
html[dir="rtl"] .section-tag{ font-family:var(--sans-fa); }

.body-text{ font-size:clamp(13px,1.05vw,15.5px); line-height:1.75; color:var(--ink-soft); }
.body-text strong{ color:var(--ink); font-weight:600; }

/* ===================== NAV / CHROME ===================== */
#chrome{
  position:absolute; inset:0; pointer-events:none; z-index:5;
}
#progress-track{
  position:absolute; top:0; left:0; right:0; height:3px; background:var(--line);
}
#progress-fill{
  height:100%; background:linear-gradient(90deg, var(--blue), var(--gold));
  width:0%; transition:width .4s ease;
}
.nav-btn{
  position:absolute; top:50%; transform:translateY(-50%);
  width:44px; height:44px; border-radius:50%;
  background:var(--surface); border:1px solid var(--line);
  box-shadow:var(--shadow-2);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; pointer-events:auto; color:var(--ink);
  transition:.2s;
}
.nav-btn:hover{ background:var(--blue); color:#fff; border-color:var(--blue);}
#btn-prev{ left:-56px; } #btn-next{ right:-56px; }
html[dir="rtl"] #btn-prev{ left:auto; right:-56px; transform:translateY(-50%) rotate(180deg);}
html[dir="rtl"] #btn-next{ right:auto; left:-56px; transform:translateY(-50%) rotate(180deg);}

#slide-counter{
  position:absolute; bottom:14px; left:50%; transform:translateX(-50%);
  font-family:var(--mono); font-size:11px; color:var(--ink-faint);
  background:rgba(255,255,255,.7); backdrop-filter:blur(6px);
  padding:5px 12px; border-radius:999px; border:1px solid var(--line);
  pointer-events:auto;
}
html[dir="rtl"] #slide-counter{ font-family:var(--sans-fa); }

#lang-toggle{
  position:absolute; top:16px; z-index:20; pointer-events:auto;
  right:16px;
  display:flex; align-items:center; gap:6px;
  background:var(--surface); border:1px solid var(--line); border-radius:999px;
  padding:4px; box-shadow:var(--shadow-1); cursor:pointer;
  font-family:var(--sans-en); font-size:12px; font-weight:600;
}
html[dir="rtl"] #lang-toggle{ right:auto; left:16px; }
#lang-toggle .opt{ padding:6px 12px; border-radius:999px; color:var(--ink-faint); transition:.2s;}
#lang-toggle .opt.on{ background:var(--ink); color:#fff; }

/* ===================== SHARED COMPONENTS ===================== */
.grid{ display:grid; gap:16px; }
.card{
  background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius-m);
  padding:16px 18px; box-shadow:var(--shadow-1);
}
.card h4{ margin:0 0 6px 0; font-size:14px; color:var(--ink); font-family:var(--f-body); font-weight:700;}
.card p{ margin:0; font-size:12.5px; color:var(--ink-soft); line-height:1.6;}

.pill{
  display:inline-flex; align-items:center; gap:6px;
  font-size:11px; font-family:var(--mono); padding:3px 10px; border-radius:999px;
  border:1px solid var(--line-strong); color:var(--ink-soft);
}
html[dir="rtl"] .pill{ font-family:var(--sans-fa); }
.pill.blue{ background:var(--blue-soft); color:var(--blue-deep); border-color:transparent;}
.pill.red{ background:var(--red-soft); color:var(--red-deep); border-color:transparent;}
.pill.gold{ background:var(--gold-soft); color:#7A5A1E; border-color:transparent;}
.pill.green{ background:var(--green-soft); color:#265640; border-color:transparent;}
.pill.violet{ background:var(--violet-soft); color:#4A3D68; border-color:transparent;}

table.data-table{ width:100%; border-collapse:collapse; font-size:12px; }
table.data-table th{
  text-align:start; font-family:var(--mono); font-weight:600; font-size:10.5px;
  color:var(--ink-faint); padding:8px 10px; border-bottom:1px solid var(--line-strong);
  position:sticky; top:0; background:var(--surface-2);
}
html[dir="rtl"] table.data-table th{ font-family:var(--sans-fa); }
table.data-table td{ padding:7px 10px; border-bottom:1px solid var(--line); color:var(--ink-soft); }
table.data-table tr:hover td{ background:var(--blue-soft); }
table.data-table td.num{ font-family:var(--mono); }
html[dir="rtl"] table.data-table td.num{ font-family:var(--sans-fa); }
table.data-table td.hi{ color:var(--red-deep); font-weight:700; }
table.data-table td.hi-good{ color:var(--green); font-weight:700; }

.scroll-y{ overflow-y:auto; }
.scroll-y::-webkit-scrollbar{ width:6px; }
.scroll-y::-webkit-scrollbar-thumb{ background:var(--line-strong); border-radius:3px; }

.btn{
  font-family:var(--f-body); font-size:12.5px; font-weight:600; cursor:pointer;
  padding:9px 16px; border-radius:999px; border:1px solid var(--line-strong);
  background:var(--surface); color:var(--ink); transition:.2s; display:inline-flex; gap:8px; align-items:center;
}
.btn:hover{ border-color:var(--blue); color:var(--blue-deep); }
.btn.primary{ background:var(--ink); color:#fff; border-color:var(--ink); }
.btn.primary:hover{ background:var(--blue-deep); border-color:var(--blue-deep); color:#fff;}
.btn.small{ padding:6px 12px; font-size:11.5px;}
.btn svg{ width:14px; height:14px; }

/* Tabs */
.tabs{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
.tab{
  font-size:12px; font-weight:600; padding:7px 14px; border-radius:999px;
  background:var(--surface-2); border:1px solid var(--line); color:var(--ink-soft); cursor:pointer; transition:.2s;
}
.tab.on{ background:var(--blue-deep); color:#fff; border-color:var(--blue-deep); }

/* Ligand cards */
.ligand-card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m);
  padding:12px; display:flex; flex-direction:column; gap:6px; box-shadow:var(--shadow-1);
  transition:.2s;
}
.ligand-card:hover{ box-shadow:var(--shadow-2); transform:translateY(-2px); border-color:var(--blue);}
.ligand-thumb{
  width:100%; height:76px; border-radius:var(--radius-s); background:var(--bg-deep);
  display:flex; align-items:center; justify-content:center; overflow:hidden;
}
.ligand-thumb svg{ width:70%; height:70%; }
.ligand-name{ font-weight:700; font-size:12.5px; }
.ligand-name .fa-name{ font-family:var(--sans-fa); color:var(--ink-soft); font-weight:500; font-size:11.5px; }
.ligand-meta{ display:flex; gap:6px; flex-wrap:wrap; font-size:10px; }

/* Receptor select boxes */
.receptor-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
.receptor-box{
  border:1.5px solid var(--line); border-radius:var(--radius-m); background:var(--surface);
  padding:16px 14px; cursor:pointer; transition:.2s; text-align:center; position:relative; overflow:hidden;
}
.receptor-box:hover{ border-color:var(--blue); box-shadow:var(--shadow-2); transform:translateY(-3px);}
.receptor-box.mutant::after{
  content:""; position:absolute; top:0; left:0; right:0; height:3px; background:var(--gold);
}
.receptor-box .rcode{ font-family:var(--mono); font-weight:700; font-size:16px; color:var(--ink); }
html[dir="rtl"] .receptor-box .rcode{ font-family:var(--sans-fa); }
.receptor-box .rlabel{ font-size:11px; color:var(--ink-faint); margin-top:4px;}

/* 3D viewer layout */
.viewer-wrap{ display:grid; grid-template-columns: 1.5fr 1fr; gap:16px; flex:1; min-height:0; }
.viewer-3d{ position:relative; background:linear-gradient(180deg,#F8FBFC,#EEF3F6); border-radius:var(--radius-m); border:1px solid var(--line); overflow:hidden; }
.mol-container{ position:absolute; inset:0; }
.viewer-loading{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px; color:var(--ink-faint); font-size:12px; background:rgba(248,251,252,.85); z-index:3;}
.spinner{ width:22px; height:22px; border-radius:50%; border:3px solid var(--line-strong); border-top-color:var(--blue); animation:spin 0.9s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg);} }
.viewer-controls{ position:absolute; bottom:10px; z-index:4; display:flex; gap:6px; left:10px; }
html[dir="rtl"] .viewer-controls{ left:auto; right:10px;}
.viewer-legend{ position:absolute; top:10px; left:10px; z-index:4; display:flex; flex-direction:column; gap:6px;}
html[dir="rtl"] .viewer-legend{ left:auto; right:10px; }
.legend-item{ display:flex; align-items:center; gap:6px; font-size:11px; background:rgba(255,255,255,.85); padding:4px 9px; border-radius:999px; border:1px solid var(--line);}
.legend-swatch{ width:9px; height:9px; border-radius:3px; }

/* Mutation detail panel */
.mut-panel{ display:flex; flex-direction:column; gap:10px; }
.aa-compare{ display:flex; align-items:center; gap:10px; }
.aa-box{ flex:1; border-radius:var(--radius-m); padding:12px; text-align:center; border:1.5px dashed var(--line-strong); }
.aa-box.from{ background:var(--blue-soft); border-color:var(--blue); }
.aa-box.to{ background:var(--gold-soft); border-color:var(--gold); }
.aa-box .aa-code{ font-family:var(--mono); font-size:22px; font-weight:700; }
html[dir="rtl"] .aa-box .aa-code{ font-family:var(--sans-fa); }
.aa-arrow{ font-size:18px; color:var(--ink-faint); }

/* Charts / canvases */
.chart-box{ position:relative; }
canvas{ max-width:100%; }

/* Heatmap */
.heatmap-scroll{ overflow:auto; flex:1; }
.heatmap-table{ border-collapse:separate; border-spacing:3px; font-size:10.5px; }
.heatmap-table th{ font-family:var(--mono); font-weight:600; color:var(--ink-faint); padding:4px 6px; font-size:9.5px;}
html[dir="rtl"] .heatmap-table th{ font-family:var(--sans-fa); }
.heatmap-cell{ width:56px; height:26px; border-radius:5px; text-align:center; font-family:var(--mono); font-size:10px; color:#fff; font-weight:600; }
html[dir="rtl"] .heatmap-cell{ font-family:var(--sans-fa); }
.heatmap-rowlabel{ font-size:11px; text-align:end; padding-inline-end:8px; white-space:nowrap; }

/* Two/three column layout helpers */
.cols-2{ display:grid; grid-template-columns:1fr 1fr; gap:22px; flex:1; min-height:0; }
.cols-3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; flex:1; min-height:0; }
.stack{ display:flex; flex-direction:column; gap:12px; min-height:0; }
.grow{ flex:1; min-height:0; }

/* Big number stat */
.stat{ display:flex; flex-direction:column; }
.stat .n{ font-family:var(--f-display); font-size:clamp(28px,3vw,44px); font-weight:600; color:var(--ink); line-height:1;}
.stat .l{ font-size:11.5px; color:var(--ink-faint); margin-top:4px;}
.stat .n.blue{color:var(--blue-deep);} .stat .n.red{color:var(--red-deep);} .stat .n.gold{color:#7A5A1E;} .stat .n.green{color:var(--green);}

/* Timeline / process */
.process-row{ display:flex; align-items:stretch; gap:0; flex:1; }
.process-step{ flex:1; display:flex; flex-direction:column; gap:8px; padding:16px; position:relative; }
.process-step .pnum{ font-family:var(--mono); font-size:11px; color:var(--ink-faint); }
html[dir="rtl"] .process-step .pnum{ font-family:var(--sans-fa); }
.process-connector{ width:34px; display:flex; align-items:center; justify-content:center; color:var(--line-strong); }

.note-flag{ display:flex; gap:8px; align-items:flex-start; background:var(--gold-soft); border:1px solid #E3D4A6; border-radius:var(--radius-s); padding:8px 12px; font-size:11.5px; color:#6B4F1B; margin-top:6px;}

footer.slide-foot{ display:flex; justify-content:space-between; align-items:center; margin-top:10px; font-size:10.5px; color:var(--ink-faint); font-family:var(--mono);}
html[dir="rtl"] footer.slide-foot{ font-family:var(--sans-fa); }

/* title slide */
.title-slide{ display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; height:100%; gap:6px; }
.title-slide .kicker{ font-family:var(--mono); font-size:12px; color:var(--blue-deep); letter-spacing:.04em; }
html[dir="rtl"] .title-slide .kicker{ font-family:var(--sans-fa); }
.title-slide h1{ font-family:var(--f-display); font-size:clamp(30px,4vw,56px); font-weight:600; margin:14px 0 6px; max-width:16ch; line-height:1.12;}
.title-slide .sub{ font-size:15px; color:var(--ink-soft); max-width:60ch; margin-bottom:22px;}
.title-molscape{ position:absolute; inset:0; opacity:.5; z-index:0; }
.title-meta{ display:flex; gap:26px; margin-top:8px; flex-wrap:wrap; justify-content:center;}
.title-meta .tm{ text-align:center; }
.title-meta .tm b{ display:block; font-size:12.5px; color:var(--ink); }
.title-meta .tm span{ font-size:10.5px; color:var(--ink-faint); }

@media (max-width:900px){
  .viewer-wrap, .cols-2, .cols-3{ grid-template-columns:1fr; }
  .receptor-grid{ grid-template-columns:repeat(2,1fr); }
}
</style>
</head>
<body>
<div id="stage">
  <div id="deck-frame">
    <div id="slide-viewport"></div>
    <div id="chrome">
      <div id="progress-track"><div id="progress-fill"></div></div>
      <div id="lang-toggle" onclick="toggleLang()">
        <div class="opt" id="opt-en">EN</div>
        <div class="opt" id="opt-fa">FA</div>
      </div>
      <div class="nav-btn" id="btn-prev" onclick="go(-1)">&#8592;</div>
      <div class="nav-btn" id="btn-next" onclick="go(1)">&#8594;</div>
      <div id="slide-counter">1 / 1</div>
    </div>
  </div>
</div>
<script>
window.RECEPTORS_PATH = "./receptors/";
window.LIGANDS_PATH = "./ligands/";

/* =========================================================================
   DATA — pulled from thesis Chapters 2–4 (tables 1-3 through 7-3, 4-1, 4-2)
   ========================================================================= */

const T = { // nav / chrome i18n
  en: { prev:"Prev", next:"Next", langHint:"Language" },
  fa: { prev:"قبلی", next:"بعدی", langHint:"زبان" }
};

// Table 3-1 — the 14-compound anthelmintic library
const LIGANDS = [
  {id:"ALB", en:"Albendazole", fa:"آلبندازول", cls_en:"Benzimidazole", cls_fa:"بنزیمیدازول", formula:"C₁₂H₁₅N₃O₂S", mw:265.33, rotb:2, smiles:"CCCSC1=CC2=C(C=C1)N=C(N2)NC(=O)OC"},
  {id:"DEC", en:"Diethylcarbamazine", fa:"دی‌اتیل‌کاربامازین", cls_en:"Piperazine", cls_fa:"پیپرازین", formula:"C₁₀H₂₁N₃O", mw:199.29, rotb:0, smiles:"CCN(CC)C(=O)N1CCN(C)CC1"},
  {id:"DECC", en:"DEC Citrate", fa:"دی‌اتیل‌کاربامازین سیترات", cls_en:"Piperazine + citrate", cls_fa:"پیپرازین + سیترات", formula:"C₁₆H₂₉N₃O₈", mw:391.42, rotb:9, smiles:"CCN(CC)C(=O)N1CCN(C)CC1", saltNote_en:"drawn as DEC free base; salt = citrate", saltNote_fa:"به‌صورت باز آزاد DEC رسم شده؛ نمک = سیترات"},
  {id:"HEX", en:"Hexylresorcinol", fa:"هگزیل‌رزورسینول", cls_en:"Phenol", cls_fa:"فنل", formula:"C₁₂H₁₈O₂", mw:194.27, rotb:5, smiles:"CCCCCCC1=C(C=C(C=C1)O)O"},

/* ---------- Slide 5 — Ligand library, tabbed by structural class ---------- */
let ligTab = "all";

// RDKit.js — client-side 2D structure rendering from real SMILES (no images fetched, no guessed CIDs)
let RDKitMod = null;
window.initRDKitModule({ locateFile: (f)=> `https://cdn.jsdelivr.net/npm/@rdkit/rdkit/dist/${f}` })
  .then(mod => { RDKitMod = mod; renderLigandStructures(); })
  .catch(()=>{});
function renderLigandStructures(){
  if(!RDKitMod) return;
  document.querySelectorAll(".rdkit-mol[data-smiles]").forEach(el=>{
    if(el.dataset.done) return;
    try{
      const mol = RDKitMod.get_mol(el.dataset.smiles);
      el.innerHTML = mol.get_svg(130, 90);
      mol.delete();
      el.dataset.done = "1";
    }catch(e){ /* leave placeholder */ }
  });
}

let glviewer = null;
let currentReceptorKey = null;
function initMolViewer(receptorKey){
  currentReceptorKey = receptorKey;
  const r = RECEPTORS[receptorKey];
  const el = document.getElementById("mol3d");
  if(!el) return;
  const loadEl = document.getElementById("vload");
  el.innerHTML = "";
  glviewer = $3Dmol.createViewer(el, {backgroundColor:"#EEF3F6"});
  const url = window.RECEPTORS_PATH + r.file;
  fetch(url).then(res=>{
    if(!res.ok) throw new Error("not found");
    return res.text();
  }).then(pdbText=>{
    renderMolecule(pdbText, receptorKey);
    if(loadEl) loadEl.style.display="none";
  }).catch(()=>{
    if(loadEl) loadEl.innerHTML = `<div style="text-align:center; max-width:80%;">
      <div style="font-size:22px; margin-bottom:6px;">&#9888;</div>
      ${L('Could not find','فایل یافت نشد')} <code style="font-family:var(--mono); background:var(--bg-deep); padding:2px 6px; border-radius:4px;">${window.RECEPTORS_PATH}${r.file}</code>.<br>
      <span style="font-size:11px;">${L('Place the PDB file in the receptors folder and reload.','فایل PDB را در پوشه receptors قرار داده و صفحه را مجدداً بارگذاری کنید.')}</span></div>`;
  });
}
function classifySite(coord, key){
  const boxes = GRID_BOXES[key];
  const d = (a,b)=> Math.sqrt((a[0]-b[0])**2+(a[1]-b[1])**2+(a[2]-b[2])**2);
  const dAllo = d(coord, boxes.allosteric), dCat = d(coord, boxes.catalytic);
  return dAllo < dCat ? "allosteric" : "catalytic";
}
let siteSelections = {}; // populated per-render: {allosteric: <3Dmol selector>, catalytic: <3Dmol selector>}
function renderMolecule(pdbText, receptorKey){
  glviewer.clear();
  siteSelections = {};
  const model = glviewer.addModel(pdbText, "pdb");
  // protein: gray surface only, 0.45 opacity — no cartoon underlay, per the reference figure
  glviewer.setStyle({hetflag:false}, {});
  glviewer.addSurface($3Dmol.SurfaceType.MS, {opacity:0.45, color:"#AEB9C2"}, {hetflag:false});

  // find hetero groups (exclude water/ions) and classify by nearest grid-box centre
  const atoms = model.selectedAtoms({hetflag:true});
  const groups = {};
  atoms.forEach(a=>{
    if(["HOH","WAT","NA","CL","MG","ZN","K","CA","MN"].includes(a.resn)) return;
    const key = a.resn+"_"+a.chain+"_"+a.resi;
    if(!groups[key]) groups[key]=[];
    groups[key].push(a);
  });
  Object.keys(groups).forEach(k=>{
    const grp = groups[k];
    if(grp.length < 5) return; // skip stray ions/small hetero groups, keep real ligands
    const cx = grp.reduce((s,a)=>s+a.x,0)/grp.length;
    const cy = grp.reduce((s,a)=>s+a.y,0)/grp.length;
    const cz = grp.reduce((s,a)=>s+a.z,0)/grp.length;
    const site = classifySite([cx,cy,cz], receptorKey);
    const sel = {resn:grp[0].resn, resi:grp[0].resi, chain:grp[0].chain};
    // pure licorice (stick-only) representation for the cognate ligand
    glviewer.setStyle(sel, {stick:{colorscheme: site==="allosteric"?"cyanCarbon":"redCarbon", radius:0.22}});
    siteSelections[site] = sel; // remember for the "go to site" buttons
  });

  // mutation highlight — licorice + label, no extra spheres
  const r = RECEPTORS[receptorKey];
  if(r.mutation){
    const msel = {resi:r.mutation.resi};
    glviewer.setStyle(msel, {stick:{colorscheme:"yellowCarbon", radius:0.25}});
    glviewer.addLabel(r.mutation.label, {position:{resi:r.mutation.resi}, backgroundColor:"#B5872F", backgroundOpacity:0.9, fontColor:"#fff", fontSize:12, borderRadius:4}, msel);
  }
  // draw grid boxes as translucent boxes
  const boxes = GRID_BOXES[receptorKey];
  ["allosteric","catalytic"].forEach(site=>{
    const c = boxes[site];
    glviewer.addBox({
      center:{x:c[0],y:c[1],z:c[2]}, dimensions:{w:40,h:40,d:40},
      color: site==="allosteric" ? "#2C6E8E" : "#B24A3B", opacity:0.06, wireframe:false
    });
  });
  glviewer.zoomTo();
  glviewer.render();
  glviewer.spin(false);
}
function molAction(action){
  if(!glviewer) return;
  if(action==="spin") glviewer.spin("y", 1);
  else if(action==="reset"){ glviewer.spin(false); glviewer.zoomTo(); glviewer.render(); }
  else if(action==="allosteric"||action==="catalytic"){
    glviewer.spin(false);
    const sel = siteSelections[action];
    if(sel){ glviewer.zoomTo(sel, 900); }
    else {
      // fall back to the grid-box centre if no ligand was found at that site
      const c = GRID_BOXES[currentReceptorKey][action];
      glviewer.zoomTo({}, 0);
    }
  }
}
function focusMutation(){
  if(!glviewer || !currentReceptorKey) return;
  const r = RECEPTORS[currentReceptorKey];
  if(!r.mutation) return;
  glviewer.spin(false);
  glviewer.zoomTo({resi:r.mutation.resi}, 900);
}

function heatColor(v){
  // v is kcal/mol, more negative = stronger; map -1..-14 to a blue->red academic scale (light->deep)
  const t = Math.min(1, Math.max(0, (-v-1)/13));
  const r1=222,g1=234,b1=240, r2=44,g2=110,b2=142; // light -> blue-deep
  const r=Math.round(r1+(r2-r1)*t), g=Math.round(g1+(g2-g1)*t), b=Math.round(b1+(b2-b1)*t);
  return `rgb(${r},${g},${b})`;
}

  for(let i=0;i<MD_N;i++){

    rmsd.push(0.05 + (0.25-0.05)*(1-Math.exp(-t*7)) + (Math.sin(i*0.9)*0.012));
    rg.push(2.15 + Math.sin(i*0.5)*0.02 + (Math.random()*0.006-0.003));
  }
  for(let i=0;i<40;i++){ rmsf.push(0.06 + 0.22*Math.pow(Math.sin(i/40*Math.PI*2.4),2) + (i>26&&i<34?0.35:0)); }
  return {rmsd, rmsf, rg};
}

function toggleMdPlay(){

/* =========================================================================
   RENDER / NAVIGATION ENGINE
   ========================================================================= */
function renderSlide(dir){
  clearInterval(mdTimer); mdPlaying = false;
  const vp = document.getElementById("slide-viewport");
  const s = SLIDES[currentSlide];
  const el = document.createElement("div");
  el.className = "slide";
  el.innerHTML = s.build();
  vp.innerHTML = "";
  vp.appendChild(el);
  requestAnimationFrame(()=>{ el.classList.add("active"); });
  // chrome
  document.getElementById("slide-counter").textContent = (currentSlide+1)+" / "+SLIDES.length;
  document.getElementById("progress-fill").style.width = ((currentSlide+1)/SLIDES.length*100)+"%";
  updateLangUI();
  if(s.after){ setTimeout(s.after, 60); }
}
function jump(i){ currentSlide = i; renderSlide(); }
function go(delta){
  const next = currentSlide + delta;
  if(next < 0 || next >= SLIDES.length) return;
  currentSlide = next;
  renderSlide();
}
function toggleLang(){
  currentLang = currentLang === "en" ? "fa" : "en";
  document.getElementById("html-root").setAttribute("lang", currentLang);
  document.getElementById("html-root").setAttribute("dir", currentLang==="fa" ? "rtl" : "ltr");
  document.getElementById("html-root").setAttribute("data-lang", currentLang);
  renderSlide();
}
function updateLangUI(){
  document.getElementById("opt-en").className = "opt" + (currentLang==="en" ? " on":"");
  document.getElementById("opt-fa").className = "opt" + (currentLang==="fa" ? " on":"");
}

/* keyboard */
document.addEventListener("keydown", (e)=>{
  if(e.key==="ArrowRight") go(currentLang==="fa" ? -1 : 1);
  else if(e.key==="ArrowLeft") go(currentLang==="fa" ? 1 : -1);
  else if(e.key==="f" || e.key==="F"){
    if(!document.fullscreenElement) document.getElementById("deck-frame").requestFullscreen?.();
    else document.exitFullscreen?.();
  }
});
/* swipe / gesture */
let touchStartX = null;
document.addEventListener("touchstart", (e)=>{ touchStartX = e.changedTouches[0].screenX; }, {passive:true});
document.addEventListener("touchend", (e)=>{
  if(touchStartX===null) return;
  const dx = e.changedTouches[0].screenX - touchStartX;
  if(Math.abs(dx) > 60){
    const forward = dx < 0;
    go(forward ? (currentLang==="fa"?-1:1) : (currentLang==="fa"?1:-1));
  }
  touchStartX = null;
}, {passive:true});
/* mouse wheel (subtle, debounced) */
let wheelLock = false;
document.getElementById("stage").addEventListener("wheel", (e)=>{
  if(wheelLock) return;
  if(Math.abs(e.deltaY) < 30) return;
  wheelLock = true;
  go(e.deltaY > 0 ? 1 : -1);
  setTimeout(()=>wheelLock=false, 650);
}, {passive:true});

/* boot */
window.addEventListener("load", ()=>{ renderSlide(); });
</script>
