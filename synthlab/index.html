<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atomiverse Clone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    
    
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background: linear-gradient(95deg,rgba(247, 247, 247, 1) 0%, rgba(237, 237, 237, 1) 94%, rgb(255, 255, 255) 100%);
  color:#101828;
}

/* NAVBAR */

.navbar{
  height:80px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 60px;
  background:white;
}

.logo{
  font-size:25px;
  font-weight:800;
}

nav{
  display:flex;
  align-items:center;
  gap:36px;
}

nav a{
  text-decoration:none;
  color:#6b7280;
}

.launch-btn{
  border:none;
  background:#0f172a;
  color:white;
  padding:14px 22px;
  border-radius:12px;
  font-weight:600;
  cursor:pointer;
}

/* HERO */

.hero{
  display:grid;
  grid-template-columns:1.1fr 1.3fr;
  /* min-height: 150px; */

}

.hero-content{
  padding:80px 60px;
  
}

.eyebrow{
  letter-spacing:2px;
  font-size:13px;
  color:#94a3b8;
  font-weight:600;
}

.hero h1{
  margin-top:24px;
  font-size:50px;
  line-height:0.95;
  font-weight:800;
}

.hero h1 span{
  color:#4b5563;
}

.hero p{
  margin-top:30px;
  max-width:560px;
  line-height:1.8;
  font-size:16px;
  color:#64748b;
}

.actions{
  margin-top:40px;
  display:flex;
  align-items:center;
  gap:20px;
}

.primary-btn{
  background:#08112b;
  color:white;
  border:none;
  border-radius:16px;
  padding:18px 32px;
  font-size:18px;
  cursor:pointer;
}

.actions a{
  text-decoration:none;
  color:#94a3b8;
}

.badges{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:50px;
}
.hero-visual{
    width: 80px;
    height: 80px;
    img{
        width: 500px;
        height: auto;
        align-items: center;
        margin: auto;
    }
}

.badges span{
  padding:8px 14px;
  border:1px solid #dbe1ea;
  border-radius:10px;
  background:white;
  font-size:14px;
}
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="logo">SynthLab</div>

    <nav>
      <a href="learn.html">Documentation</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
      <a href="synth-lab.html">
        <button class="launch-btn">
        Launch →
        </button>
      </a>

    </nav>
  </header>

  <!-- HERO -->
  <section class="hero">

    <div class="hero-content">

      <span class="eyebrow">
        MOLECULAR SIMULATION PLATFORM
      </span>

      <h1>
        From structure
        <br>
        <span>to simulation.</span>
      </h1>

      <p>
        Visualize, build, and run molecular simulations —
        all from your browser. One platform for the full
        molecular workflow, no installation required.
      </p>

      <div class="actions">
        <button class="primary-btn">
          Launch SynthLab →
        </button>

        <a href="learn.html">Read the docs →</a>
      </div>

      <div class="badges">
        <span>XYZ</span>
        <span>CIF</span>
        <span>SMILES</span>
        <span>SDF / MOL</span>
        <span>Trajectories</span>
      </div>
    </div>

    <!-- RIGHT SIDE -->
    <div class="hero-visual">
        <img src="Dichloran.gif" alt="gif">
    </div>

  </section>


  </script>
</body>

</html>
