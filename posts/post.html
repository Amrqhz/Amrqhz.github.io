<body>
    <div class="site-wrapper">

        <!-- HEADER (same as index) -->
        <header class="site-header">
            <a href="../index.html" class="logo-mark">Amir Hossein</a>

            <button class="menu-toggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="site-nav">
                <span></span>

        <main class="site-main">
            <article class="post" id="post" hidden>

                <a href="./index.html" class="post-back">← all posts</a>

                <!-- POST HEADER -->
                <header class="post-header">
                    <a class="post-category" id="postCategory" href="#"></a>
                    <h1 class="post-title" id="postTitle"></h1>
                    <p class="post-meta">
                        <time id="postDate"></time>
                        <span class="dot" aria-hidden="true">·</span>
                        <span id="postReadTime"></span>
                    </p>
                    <div class="post-tags" id="postTags"></div>
                </header>

                <!-- MARKDOWN BODY -->
                <div class="post-body" id="postBody"></div>

                <!-- ACTIONS: love + share -->
                <div class="post-actions">
                    <button class="love-btn" id="loveBtn" type="button" aria-pressed="false">
                        <svg class="love-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                            <path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.7 5 6.1 5c2.1 0 3.8 1.2 4.9 2.9h2C14.1 6.2 15.8 5 17.9 5c3.4 0 5.2 3.4 3.7 6.8C19.5 16.4 12 21 12 21z" />
                        </svg>
                        <span class="love-label">Loved it</span>
                    </button>

                    <div class="share">
                        <span class="share-label">share</span>
                        <a class="share-btn" id="shareX" target="_blank" rel="noopener noreferrer" aria-label="Share on X">
                            <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M17.8 3h3.1l-6.8 7.7L22 21h-6.2l-4.9-6.4L5.3 21H2.2l7.2-8.3L1.9 3h6.4l4.4 5.8L17.8 3zm-1.1 16.2h1.7L7.3 4.7H5.5l11.2 14.5z" /></svg>
                        </a>
                        <a class="share-btn" id="shareTelegram" target="_blank" rel="noopener noreferrer" aria-label="Share on Telegram">
                            <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M21.5 3.4 2.6 10.7c-1.3.5-1.3 1.3-.2 1.6l4.8 1.5 1.9 5.8c.2.6.1.8.7.8.5 0 .7-.2 1-.5l2.3-2.2 4.8 3.5c.9.5 1.5.2 1.7-.8L22.9 4.9c.3-1.3-.5-1.9-1.4-1.5zM8.6 13.3l9.7-6.1c.5-.3.9-.1.5.2l-8.1 7.3-.3 3.4-1.8-4.8z" /></svg>
                        </a>
                        <a class="share-btn" id="shareLinkedIn" target="_blank" rel="noopener noreferrer" aria-label="Share on LinkedIn">
                            <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9.5h4V21H3V9.5zm7 0h3.8v1.6h.1c.5-1 1.8-1.9 3.7-1.9 4 0 4.7 2.6 4.7 6V21h-4v-5.1c0-1.3 0-2.9-1.8-2.9s-2.1 1.4-2.1 2.8V21h-4V9.5z" /></svg>
                        </a>
                        <a class="share-btn" id="shareWhatsApp" target="_blank" rel="noopener noreferrer" aria-label="Share on WhatsApp">
                            <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.100L2 22l5-1.300A10 10 0 1 0 12 2zm0 18.100c-1.5 0-3-.4-4.2-1.200l-.3-.2-3 .8.8-2.9-.2-.3A8.1 8.1 0 1 1 12 20.100zm4.5-6c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.100l-.8 1c-.1.2-.3.2-.5.1-1.4-.7-2.4-1.3-3.3-2.9-.2-.4.2-.4.7-1.2.1-.2 0-.3 0-.5l-.8-1.800c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.8.8-1 1.7-.9 2.6.3 1.2 1 2.3 2 3.3 1.8 1.9 3.3 2.4 4.6 2.8.6.2 1.1.100 1.6 0 .5-.1 1.4-.6 1.6-1.2.2-.6.2-1 .1-1.2-.1-.1-.3-.2-.5-.3z" /></svg>
                        </a>
                        <button class="share-btn" id="shareCopy" type="button" aria-label="Copy link">
                            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7" /><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7" /></svg>
                        </button>
                        <span class="copy-toast" id="copyToast" role="status" aria-live="polite"></span>
                    </div>
                </div>
            </article>

            <!-- ERROR STATE -->
            <section class="post-error" id="postError" hidden>
                <h1 class="post-title">Post not found</h1>
                <p>Check the link, or <a href="./posts">browse all posts</a>.</p>
